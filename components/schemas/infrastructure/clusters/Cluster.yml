title: Cluster
type: object
description: >-
  Clusters are logical groups of servers that act as an isolation and
  organization boundary within Cycle. A server belongs to exactly one cluster,
  and resources (environments, networks) are scoped to it. Physical separation
  depends on how the underlying servers are provisioned and is not guaranteed
  by the cluster boundary itself.
required:
  - id
  - identifier
  - creator
  - hub_id
  - state
  - non_essential
  - events
properties:
  id:
    type: string
  identifier:
    $ref: ../../Identifier.yml
    description: A human readable slugged identifier for this cluster.
  creator:
    $ref: ../../creators/CreatorScope.yml
  hub_id:
    $ref: ../../HubID.yml
  acl:
    anyOf:
      - $ref: ../../common/ACL.yml
      - type: "null"
  non_essential:
    type: boolean
    description: Marks a cluster as non-essential. Non-essential cluster resources are excluded by default from certain metrics and summaries unless opted in.
  state:
    $ref: ./ClusterState.yml
  events:
    title: ClusterEvents
    type: object
    description: A collection of timestamps for each event in the cluster's lifetime.
    required:
      - created
      - updated
      - deleted
    properties:
      created:
        description: The timestamp of when the cluster was created.
        $ref: ../../DateTime.yml
      updated:
        description: The timestamp of when the cluster was updated.
        $ref: ../../DateTime.yml
      deleted:
        description: The timestamp of when the cluster was deleted.
        $ref: ../../DateTime.yml
