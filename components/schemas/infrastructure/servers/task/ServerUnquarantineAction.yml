title: ServerUnquarantineAction
type: object
description: |
  A job that removes a server from quarantine and adds it to the given cluster.
  Servers deployed from a virtual provider are quarantined when they first check in.
required:
  - action
  - contents
properties:
  action:
    type: string
    description: The action to take.
    enum:
      - unquarantine
  contents:
    type: object
    required:
      - cluster
    properties:
      cluster:
        type: string
        description: The cluster to add the server to.
