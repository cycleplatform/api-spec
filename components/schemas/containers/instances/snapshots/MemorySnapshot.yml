title: InstanceTelemetryMemorySnapshot
type: object
description: A snapshot of memory usage statistics.
required:
  - allocation
properties:
  cache:
    type: number
    description: The number of bytes of page cache memory being used by this instance.
  usage:
    description: The memory usage data.
    "$ref": "./MemoryData.yml"
  swap_usage:
    description: Memory swap usage data.
    "$ref": "./MemoryData.yml"
  kernel_usage:
    description: Kernel memory usage.
    "$ref": "./MemoryData.yml"
  kernel_tcp_usage:
    description: Kernel TCP buffer usage.
    "$ref": "./MemoryData.yml"
  allocation:
    description: A breakdown of memory usage by type.
    "$ref": "./MemoryAllocation.yml"
