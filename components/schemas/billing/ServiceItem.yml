title: ItemPlan
type: object
description: Information for an item's plan.
properties:
  support:
    type: object
    description: Information about the support component of the billing item.
    required:
      - id
      - name
      - price
    properties:
      id:
        "$ref": "../ID.yml"
      name:
        type: string
        description: The support contract name.
      price:
        "$ref": "./BillingAmount.yml"
  tier:
    type: object
    description: Information about the tier component of the billing item.
    required:
      - id
      - name
      - price
    properties:
      id:
        "$ref": "../ID.yml"
      name:
        type: string
        description: The tier plan name.
      price:
        "$ref": "./BillingAmount.yml"
  monitoring:
    type: object
    description: Information about the monitoring component of the billing item.
    required:
      - id
      - name
      - price
    properties:
      id:
        "$ref": "../ID.yml"
      name:
        type: string
        description: The monitoring plan name.
      price:
        "$ref": "./BillingAmount.yml"
