get:
  operationId: "getServerContainers"
  tags:
    - Servers
    - Containers
  parameters: []
  x-cycle-scopes:
    - server
  summary: List Server Containers
  description: |
    Lists all containers present on the same server as this instance.

    Requires the `server` scope to be set on the container runtime config.
  responses:
    default:
      $ref: ../../../components/responses/errors/DefaultError.yml
    200:
      description: Returns a list of containers.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../../../components/schemas/containers/Container.yml
