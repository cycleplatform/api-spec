        client_id:
          type:
            - string
            - 'null'
          description: Client ID for the Integration.
        base64_config:
          type:
            - string
            - 'null'
          description: Base64 encoded configuration for the Integration.
    IntegrationState:
      title: IntegrationState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the integration.
              type: string
              enum:
                - new
                - verifying
                - live
                - deleting
                - deleted
        - $ref: '#/components/schemas/State'
    IntegrationAdvancedOptionBoolean:
      title: IntegrationAdvancedOptionBoolean
      type: object
      required:
        - title
        - key
        - type
      properties:
        title:
          type: string
        key:
          type: string
        type:
          type: string
          enum:
            - bool
        default:
          type:
            - boolean
            - 'null'
    IntegrationAdvancedOptionInt:
      title: IntegrationAdvancedOptionInt
      type: object
      required:
        - title
        - key
        - type
      properties:
        title:
          type: string
        key:
          type: string
        type:
          type: string
          enum:
            - int
        default:
          type:
            - integer
            - 'null'
    IntegrationAdvancedOptionString:
      title: IntegrationAdvancedOptionString
      type: object
      required:
        - title
        - key
        - type
      properties:
        title:
          type: string
        key:
          type: string
        type:
          type: string
          enum:
            - string
        default:
          type:
            - string
            - 'null'
    IntegrationDefinitionField:
      title: IntegrationDefinitionField
      type: object
      required:
        - name
        - required
      properties:
        regex:
          type:
            - string
            - 'null'
        required:
          type: boolean
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - select
            - string
            - int
            - blob
        options:
          oneOf:
            - type: array
              items:
                type: string
            - type: 'null'
    IntegrationDefinition:
      title: IntegrationDefinition
      description: Describes an integration for a Cycle hub that can be enabled by the hub owner.
      type: object
      required:
        - vendor
        - name
        - supports_verification
        - supports_multiple
        - required_fields
        - url
        - public
        - usable
        - editable
      properties:
        vendor:
          type: string
        name:
          type: string
        supports_verification:
          type: boolean
        supports_multiple:
          type: boolean
        features:
          oneOf:
            - type: array
              description: A list of additional features supported by this integration.
              items:
                type: string
            - type: 'null'
        extends:
          oneOf:
            - type: array
              description: A list of functionality that this integration extends. i.e. ["backups"]
              items:
                type: string
            - type: 'null'
        extended_configuration:
          oneOf:
            - type: object
              description: Additional configuration options that are available when using this integration. These describe additional functionality that Cycle may utilize.
              properties:
                options:
                  oneOf:
                    - type: array
                      items:
                        type: object
                        discriminator:
                          propertyName: type
                          mapping:
                            bool: '#/components/schemas/IntegrationAdvancedOptionBoolean'
                            int: '#/components/schemas/IntegrationAdvancedOptionInt'
                            string: '#/components/schemas/IntegrationAdvancedOptionString'
                        oneOf:
                          - $ref: '#/components/schemas/IntegrationAdvancedOptionBoolean'
                          - $ref: '#/components/schemas/IntegrationAdvancedOptionInt'
                          - $ref: '#/components/schemas/IntegrationAdvancedOptionString'
                    - type: 'null'
            - type: 'null'
        fields:
          type: object
          properties:
            extra:
              oneOf:
                - type: object
                  additionalProperties:
                    $ref: '#/components/schemas/IntegrationDefinitionField'
                - type: 'null'
            auth:
              oneOf:
                - type: object
                  additionalProperties:
                    $ref: '#/components/schemas/IntegrationDefinitionField'
                - type: 'null'
        url:
          type: string
          format: uri
        public:
          type: boolean
        usable:
          type: boolean
          description: Whether or not this integration can be used at this time.
        deprecated:
          type: boolean
          description: If true, this integration is no longer being supported and may be removed in the future. New instances of this integration will not be able to be created.
        editable:
          type: boolean
          description: If true, the integration can be edited. Otherwise, to make a change it will need to be deleted and recreated.
    IntegrationMeta:
      title: IntegrationMeta
      type: object
      description: Additional fields that can be requested for an Integration on fetch.
      properties:
        definition:
          $ref: '#/components/schemas/IntegrationDefinition'
          description: The full Integration definition associated with this Integration.
    Integration:
      title: Integration
      type: object
      required:
        - id
        - identifier
        - name
        - vendor
        - creator
        - hub_id
        - state
        - events
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          description: Name of the integration.
        vendor:
          type: string
          description: Which vendor this integration is associated with.
        identifier:
          $ref: '#/components/schemas/Identifier'
        auth:
          description: Authentication information for the integration, can be null.
          anyOf:
            - $ref: '#/components/schemas/IntegrationAuth'
            - type: 'null'
        extra:
          description: Updated key-value pairs associated with the integration.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
        creator:
          $ref: '#/components/schemas/CreatorScope'
        hub_id:
          $ref: '#/components/schemas/ID'
          description: Identifier of the hub associated with the integration.
        state:
          $ref: '#/components/schemas/IntegrationState'
        events:
          title: IntegrationEvents
          type: object
          description: A collection of timestamps for each event in the integration's lifetime.
          required:
            - created
            - updated
            - deleted
          properties:
            created:
              description: The timestamp of when the integration was created.
              $ref: '#/components/schemas/DateTime'
            updated:
              description: The timestamp of when the integration was updated.
              $ref: '#/components/schemas/DateTime'
            deleted:
              description: The timestamp of when the integration was deleted.
              $ref: '#/components/schemas/DateTime'
        meta:
          anyOf:
            - $ref: '#/components/schemas/IntegrationMeta'
            - type: 'null'
    ExternalVolumeAbout:
      title: ExternalVolumeAbout
      type: object
      description: Additional details about the external volume.
      required:
        - description
      properties:
        description:
          description: Custom details about this external volume.
          type: string
    SourceSanIscsi:
      title: SourceSanIscsi
      type: object
      description: |
        A SAN iSCSI volume source. Defines one or more iSCSI targets and the LUN number to attach.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - san-iscsi
        details:
          type: object
          required:
            - integration_ids
            - lun
          properties:
            integration_ids:
              description: |
                One or more iSCSI integration IDs to use for authentication.
              type: array
              items:
                $ref: '#/components/schemas/ID'
            lun:
              type: integer
              format: int32
              description: |
                Logical Unit Number exposed by the target(s) to attach.
    SourceCephRbdImageRef:
      title: SourceCephRbdImageRef
      type: object
      description: Reference to the specific RBD image to attach.
      required:
        - pool
        - name
      properties:
        pool:
          type: string
          description: Name of the Ceph pool containing the RBD image.
        namespace:
          type: string
          description: Optional RBD namespace within the pool.
        name:
          type: string
          description: Name of the RBD image.
        snapshot:
          type: string
          description: Optional snapshot name if attaching a snapshot view of the image.
    SourceCephRbd:
      title: SourceCephRbd
      type: object
      description: |
        A Ceph RBD volume source. Defines monitor endpoints, optional cluster FSID, client identity (CephX), and the specific image to attach.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - ceph-rbd
        details:
          type: object
          required:
            - integration_id
            - image
          properties:
            integration_id:
              description: |
                The ID of a Ceph cluster integration for authentication.
              $ref: '#/components/schemas/ID'
            image:
              $ref: '#/components/schemas/SourceCephRbdImageRef'
    SourceAwsEbsAuth:
      title: SourceAwsEbsAuth
      type: object
      description: |
        AWS credentials for accessing EBS. Either an instance role may be used or explicit Access Key credentials may be provided.
      properties:
        use_instance_role:
          type: boolean
          description: |
            When true, use the instance's IAM role for authentication.
        access_key_id:
          type: string
          description: |
            AWS Access Key ID to use for authentication (optional if using instance role).
        secret_access_key:
          type: string
          format: password
          description: |
            AWS Secret Access Key to use for authentication (optional if using instance role).
    SourceAwsEbsRef:
      title: SourceAwsEbsRef
      type: object
      description: Reference to the specific EBS volume to attach.
      required:
        - volume_id
      properties:
        volume_id:
          type: string
          description: |
            The EBS volume ID (for example, "vol-0abcd1234ef567890").
        az:
          type: string
          description: |
            Optional AWS Availability Zone where the volume resides (for example, "us-east-1a").
    SourceAwsEbs:
      title: SourceAwsEbs
      type: object
      description: |
        An AWS EBS volume source. Defines how to authenticate to AWS and which EBS volume to attach.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - aws-ebs
        details:
          type: object
          required:
            - auth
            - volume
          properties:
            auth:
              $ref: '#/components/schemas/SourceAwsEbsAuth'
            volume:
              $ref: '#/components/schemas/SourceAwsEbsRef'
    ExternalVolumeSource:
      title: ExternalVolumeSource
      description: |
        The source information for this volume.
      oneOf:
        - $ref: '#/components/schemas/SourceSanIscsi'
        - $ref: '#/components/schemas/SourceCephRbd'
        - $ref: '#/components/schemas/SourceAwsEbs'
      discriminator:
        propertyName: type
        mapping:
          san-iscsi: '#/components/schemas/SourceSanIscsi'
          ceph-rbd: '#/components/schemas/SourceCephRbd'
          aws-ebs: '#/components/schemas/SourceAwsEbs'
    ExternalVolumeAttachmentBlock:
      title: ExternalVolumeAttachmentBlock
      type: object
      description: Configuration for a block volume attachment.
      required:
        - type
        - mode
        - details
      properties:
        type:
          type: string
          enum:
            - block
        mode:
          type: string
          description: The access mode for the attachment.
          enum:
            - single-instance-writer
            - single-instance-read-only
            - single-node-writer
            - single-node-read-only
            - multi-node-writer
            - multi-node-read-only
        details:
          type: object
          description: Details for a block attachment. Present when `type` is `block`.
          properties: {}
          additionalProperties: false
    ExternalVolumeAttachmentFileSystem:
      title: ExternalVolumeAttachmentFileSystem
      type: object
      description: Configuration for a filesystem volume attachment.
      required:
        - type
        - mode
        - details
      properties:
        type:
          type: string
          enum:
            - filesystem
        mode:
          type: string
          description: The access mode for the attachment.
          enum:
            - single-instance-writer
            - single-instance-read-only
            - single-node-writer
            - single-node-read-only
            - multi-node-writer
            - multi-node-read-only
        details:
          type: object
          description: Details for a filesystem attachment. Present when `type` is `filesystem`.
          properties: {}
          additionalProperties: false
    ExternalVolumeAttachment:
      title: ExternalVolumeAttachment
      type: object
      description: Attachment configuration for an external volume.
      discriminator:
        propertyName: type
        mapping:
          block: '#/components/schemas/ExternalVolumeAttachmentBlock'
          filesystem: '#/components/schemas/ExternalVolumeAttachmentFileSystem'
      oneOf:
        - $ref: '#/components/schemas/ExternalVolumeAttachmentBlock'
        - $ref: '#/components/schemas/ExternalVolumeAttachmentFileSystem'
    ExternalVolumeOptions:
      title: ExternalVolumeOptions
      type: object
      description: Configuration options controlling the behavior of the volume.
      required:
        - create
      properties:
        create:
          description: |
            If the volume doesn't exist, attempt to create it on container start if create struct defined.
          oneOf:
            - type: object
              required:
                - size
              properties:
                size:
                  description: Indicates the size of volume to create.
                  $ref: '#/components/schemas/DataSize'
            - type: 'null'
    ExternalVolumeState:
      title: ExternalVolumeState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current lifecycle state of the volume.
              type: string
              enum:
                - new
                - ready
                - configuring
                - live
                - deleting
                - deleted
        - $ref: '#/components/schemas/State'
    ExternalVolumeEvents:
      title: ExternalVolumeEvents
      type: object
      description: Timestamps for events that happen over the lifetime of the attached volume.
      required:
        - created
        - updated
        - deleted
      properties:
        created:
          description: The timestamp of when the attached volume was created.
          $ref: '#/components/schemas/DateTime'
        updated:
          description: The timestamp of when the attached volume was updated.
          $ref: '#/components/schemas/DateTime'
        deleted:
          description: The timestamp of when the attached volume was deleted.
          $ref: '#/components/schemas/DateTime'
        last_verified:
          $ref: '#/components/schemas/DateTime'
          description: |
            Timestamp of the last successful verification event for this volume.
        last_sync:
          $ref: '#/components/schemas/DateTime'
          description: |
            Timestamp of the last successful synchronization event for this volume.
    ContainerSummary-2:
      title: ContainerSummary
      type: object
      description: Lightweight summary of a container for environment pages and lists.
      required:
        - id
        - name
        - state
        - image
        - environment
        - volumes
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          description: A user defined name for the container.
        state:
          $ref: '#/components/schemas/ContainerState'
        image:
          $ref: '#/components/schemas/ImageSummary'
        environment:
          $ref: '#/components/schemas/ContainerEnvironmentSummary'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/VolumeSummary'
    ExternalVolumeMeta:
      title: ExternalVolumeMeta
      type: object
      description: A list of meta fields that can be applied to an attached volume.
      properties:
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerSummary-2'
    ExternalVolume:
      title: ExternalVolume
      type: object
      description: |
        A persistent storage volume within a cluster. Volumes may be attached to containers or VMs and can originate from different storage sources.
      required:
        - id
        - hub_id
        - name
        - about
        - cluster
        - location_id
        - server_ids
        - source
        - options
        - state
        - events
      properties:
        id:
          $ref: '#/components/schemas/ID'
        hub_id:
          $ref: '#/components/schemas/HubID'
        name:
          type: string
          description: The name of the external volume.
        about:
          $ref: '#/components/schemas/ExternalVolumeAbout'
        cluster:
          $ref: '#/components/schemas/Identifier'
        identifier:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        location_id:
          $ref: '#/components/schemas/ID'
        server_ids:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        source:
          $ref: '#/components/schemas/ExternalVolumeSource'
        attachment:
          description: Information about the resource the external volume is currently attached to.
          oneOf:
            - $ref: '#/components/schemas/ExternalVolumeAttachment'
            - type: 'null'
        size:
          description: |
            Size of the external volume; may be null or omitted if the size has not yet been determined.
          oneOf:
            - $ref: '#/components/schemas/DataSize'
            - type: 'null'
        options:
          $ref: '#/components/schemas/ExternalVolumeOptions'
        state:
          $ref: '#/components/schemas/ExternalVolumeState'
        events:
          $ref: '#/components/schemas/ExternalVolumeEvents'
        meta:
          $ref: '#/components/schemas/ExternalVolumeMeta'
    Certificate:
      title: Certificate
      description: A DNS TLS certificate.
      type: object
      required:
        - id
        - domains
        - private_key
        - bundle
        - hub_id
      properties:
        id:
          $ref: '#/components/schemas/ID'
        domains:
          type: array
          description: An array of domains associated with the certificate.
          items:
            type: string
        private_key:
          type: string
          description: The certificates private key.
        bundle:
          type: string
          description: A bundle of certificates that are used to verify authenticity.
        hub_id:
          $ref: '#/components/schemas/HubID'
    Metric:
      title: Metric
      description: A data point submitted to the monitoring system.
      type: object
      required:
        - metric
        - type
      properties:
        metric:
          type: string
          description: The title of the metric this data point refers to.
        type:
          type: string
          description: The type of metric
          enum:
            - gauge
            - count
            - counter
            - rate
            - histogram
            - distribution
            - set
        labels:
          type: object
          description: Any associated labels for the data, which can be used in querying.
          additionalProperties:
            type: string
        tags:
          type: array
          description: Additional tags for the data point.
          items:
            type: string
        points:
          type: array
          items:
            type: object
            required:
              - time
            properties:
              time:
                $ref: '#/components/schemas/DateTime'
              values:
                type: array
                items:
                  type: integer
    Event:
      title: Event
      description: A custom event submitted to the monitoring system.
      type: object
      required:
        - event
        - type
        - priority
      properties:
        metadata:
          anyOf:
            - type: object
              properties:
                component:
                  type: object
                  description: The associated component for this event.
                  properties:
                    id:
                      type: string
                    type:
                      type: string
            - type: 'null'
        event:
          type: string
          description: The event name.
        type:
          type: string
          enum:
            - info
            - warning
            - error
            - success
            - alert
            - notice
            - audit
        priority:
          type: string
          enum:
            - critical
            - high
            - medium
            - normal
            - low
        text:
          description: The text describing the event that has occurred.
          type:
            - string
            - 'null'
        extra:
          type: object
          additionalProperties: true
        labels:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
    NetworkState:
      title: NetworkState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the network.
              type: string
              enum:
                - live
                - deleting
                - deleted
        - $ref: '#/components/schemas/State'
    NetworkL2DhcpDetails:
      title: NetworkL2DhcpDetails
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum:
            - dhcp
        details:
          type: object
          maxProperties: 0
    NetworkL2StaticDetails:
      title: NetworkL2StaticDetails
      type: object
      required:
        - method
        - details
      properties:
        method:
          type: string
          enum:
            - static
        details:
          type: object
          properties:
            ipv4:
              oneOf:
                - type: object
                  required:
                    - network
                    - usable
                  properties:
                    network:
                      description: The CIDR for the network.
                      type: string
                    usable:
                      description: The usable CIDR.
                      type: string
                    gateway:
                      description: The IP of the gateway
                      type:
                        - string
                        - 'null'
                - type: 'null'
            ipv6:
              oneOf:
                - type: object
                  required:
                    - network
                    - usable
                  properties:
                    network:
                      description: The CIDR for the network.
                      type: string
                    usable:
                      description: The usable CIDR.
                      type: string
                    gateway:
                      description: The IP of the gateway
                      type:
                        - string
                        - 'null'
                - type: 'null'
    NetworkL2:
      title: NetworkL2
      type: object
      description: Layer 2 network information for a Cycle SDN.
      required:
        - ips
        - location_ids
      properties:
        domain:
          anyOf:
            - $ref: '#/components/schemas/L2Domain'
            - type: 'null'
        location_ids:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        vid:
          type:
            - integer
            - 'null'
        host_interface:
          type:
            - string
            - 'null'
        routes:
          description: An array of L2 routes that are added to this SDN
          type: array
          items:
            type: object
            required:
              - network
            properties:
              network:
                $ref: '#/components/schemas/Cidr'
              gateway:
                $ref: '#/components/schemas/IpAddress'
        ips:
          discriminator:
            propertyName: method
            mapping:
              dhcp: '#/components/schemas/NetworkL2DhcpDetails'
              static: '#/components/schemas/NetworkL2StaticDetails'
          oneOf:
            - $ref: '#/components/schemas/NetworkL2DhcpDetails'
            - $ref: '#/components/schemas/NetworkL2StaticDetails'
    NetworkPrivacySettings:
      title: NetworkPrivacySettings
      type: object
      description: Private network information for a Cycle SDN.
      required:
        - vxlan_tag
        - subnet
        - mac_addr_suffix
        - ipv6
      properties:
        vxlan_tag:
          type: integer
          description: A tag used to ensure proper routing.
        subnet:
          type: string
          description: The subnet of the private network.
        mac_addr_suffix:
          type: integer
          description: A number used to ensure a MAC address exists for each network.
        ipv6:
          type: object
          description: IPv6 infromation for the network.
          required:
            - ip
            - cidr
          properties:
            ip:
              type: string
              description: The networks IPv6 base.
            cidr:
              type: string
              description: The private network CIDR.
    Network:
      title: Network
      type: object
      description: SDN Network resource.
      required:
        - id
        - name
        - identifier
        - cluster
        - creator
        - hub_id
        - state
        - events
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          description: The name of the network.
        identifier:
          type: string
          description: A network identifier used to construct http calls that specifically use this network over another.
        cluster:
          type: string
          description: The infrastructure cluster the environments belonging to this network belong to.
        creator:
          $ref: '#/components/schemas/CreatorScope'
        hub_id:
          $ref: '#/components/schemas/HubID'
        state:
          $ref: '#/components/schemas/NetworkState'
        l2:
          anyOf:
            - $ref: '#/components/schemas/NetworkL2'
            - type: 'null'
        private_network:
          anyOf:
            - $ref: '#/components/schemas/NetworkPrivacySettings'
            - type: 'null'
        environments:
          description: An array of environments and timestamps.
          type:
            - array
            - 'null'
          items:
            type: object
            required:
              - id
              - added
            properties:
              id:
                $ref: '#/components/schemas/ID'
              added:
                description: A timestamp of when the environment was added.
                $ref: '#/components/schemas/DateTime'
        acl:
          anyOf:
            - $ref: '#/components/schemas/ACL'
            - type: 'null'
        events:
          title: NetworkEvents
          type: object
          description: A collection of timestamps for each event in the network's lifetime.
          required:
            - created
            - updated
            - deleted
          properties:
            created:
              description: The timestamp of when the image was created.
              $ref: '#/components/schemas/DateTime'
            updated:
              description: The timestamp of when the image was updated.
              $ref: '#/components/schemas/DateTime'
            deleted:
              description: The timestamp of when the image was deleted.
              $ref: '#/components/schemas/DateTime'
    ObjectCacheSave:
      title: ObjectCacheSave
      description: An item saved in the internal API object cache.
      type: object
      required:
        - scope
        - expires
        - key
        - value
      properties:
        scope:
          type: string
          enum:
            - global
            - environment
            - container
            - instance
        expires:
          $ref: '#/components/schemas/Duration'
        key:
          type: string
        value:
          type: string
  responses:
    DefaultError:
      description: General error response from the platform
      content:
