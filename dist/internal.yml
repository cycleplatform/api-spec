          required:
            - metrics
          properties:
            router:
              anyOf:
                - $ref: '#/components/schemas/LoadBalancerTelemetryRouterMetrics'
                - type: 'null'
            urls:
              anyOf:
                - $ref: '#/components/schemas/LoadBalancerTelemetryUrlMetrics'
                - type: 'null'
            metrics:
              $ref: '#/components/schemas/LoadBalancerTelemetryControllerMetrics'
