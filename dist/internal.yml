openapi: 3.1.0
info:
  license:
    name: Apache-2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: Cycle Internal API
  description: |
    Inside every container running on Cycle, there is a Unix socket mounted at *`/var/run/cycle/api/api.sock`*. You can send HTTP requests over this socket to access information about the local environment, access secrets, and much more.
    The way this internal API functions is very similar to how Cycle's main API works, though the purpose is different. The internal API is primarily used by instances to learn about their environment, and dynamically update as deployments change. In the future, we expect you'll be able to use the internal API to register service containers and much more.
    The internal API returns identical JSON responses to the main API. There is also a websocket based API that you can tune into for streaming platform updates.
  version: 1.0.0
  contact:
    email: support@cycle.io
  x-logo:
    url: https://static.cycle.io/icons/logo/logo-white.svg
servers:
  - description: Cycle Internal API
    url: http://localhost
    x-unix-socket:
      description: Unix socket path for internal API
      url: /var/run/cycle/api/api.sock
security:
  - tokenAuth: []
paths:
  /v1/environment:
    get:
      operationId: getEnvironment
      summary: Get Environment
      description: |
        Gets the Environment that this instance is a part of.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Environments
      x-cycle-scopes:
        - environment
      parameters: []
      responses:
        '200':
          description: Returns an Environment.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Environment'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/environment/containers:
    get:
      operationId: getEnvironmentContainers
      summary: List Environment Containers
      description: |
        Lists all Containers that are part of the same Environment as this Instance.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Environments
      x-cycle-scopes:
        - environment
      parameters: []
      responses:
        '200':
          description: Returns a collection of container resources.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Container'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/environment/instances:
    get:
      operationId: getEnvironmentInstances
      summary: List Environment Instances
      description: |
        Lists all instances present in this instance's environment.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Environments
        - Instances
      x-cycle-scopes:
        - environment
      parameters: []
      responses:
        '200':
          description: Returns a list of instances.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instance'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/environment/ips:
    get:
      operationId: getEnvironmentIPs
      summary: List Environment IPs
      description: |
        Lists the IPs associated with this Instance's Environment.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Environments
      x-cycle-scopes:
        - environment
      parameters: []
      responses:
        '200':
          description: Returns a list of detailed IP objects.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ip'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/environment/services:
    get:
      operationId: getEnvironmentServices
      summary: List Environment Services
      description: |
        Lists the services containers/instances that are in the same environment as this instance.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Environments
      x-cycle-scopes:
        - environment
      parameters: []
      responses:
        '200':
          description: Returns a list of environment services (a combination of container and instance details).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      discovery:
                        $ref: '#/components/schemas/ServiceContainer'
                      vpn:
                        $ref: '#/components/schemas/ServiceContainer'
                      loadbalancer:
                        $ref: '#/components/schemas/ServiceContainer'
                      scheduler:
                        $ref: '#/components/schemas/ServiceContainer'
                      gateway:
                        $ref: '#/components/schemas/ServiceContainer'
                    additionalProperties:
                      $ref: '#/components/schemas/ServiceContainer'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/environment/virtual-machines:
    get:
      operationId: getEnvironmentVirtualMachines
      summary: Get Environment Virtual Machines
      description: |
        Returns a list of virtual machines that are in the same environment as this instance.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Environments
      x-cycle-scopes:
        - environment
      parameters: []
      responses:
        '200':
          description: Returns a list of virtual machines.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualMachine'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/environment/services/lb/telemetry/snapshots:
    post:
      operationId: submitLoadBalancerTelemetry
      summary: Submit Environment Load Balancer Telemetry
      description: |
        Submit load balancer telemetry data.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Environments
      x-cycle-scopes:
        - environment
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/LoadBalancerTelemetrySnapshot'
      responses:
        '200':
          description: Returns a list of Instances.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/environment/scoped-variables:
    get:
      operationId: getEnvironmentScopedVariables
      summary: Get Environment Scoped Variables
      description: |
        Gets the scoped variables that are accessible to this instance via internal API.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Scoped Variables
      x-cycle-scopes:
        - environment
      parameters: []
      responses:
        '200':
          description: Returns a map of variable values, keyed by their identifier.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: string
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/hub:
    get:
      operationId: getHub
      summary: Get Hub
      description: |
        Gets the hub that this instance is a member of.

        Does not require a scope
      tags:
        - Hubs
      parameters: []
      x-cycle-scopes:
        - none
      responses:
        '200':
          description: Returns a hub.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PublicHub'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/hub/integrations:
    get:
      operationId: getHubIntegration
      summary: Get Hub Integration
      description: |
        Gets an integration based on a provided identifier or vendor query parameter. At least one of these must be provided.

        Only internal Cycle services can access this endpoint at this time.
      tags:
        - Hubs
      x-cycle-scopes:
        - none
      parameters:
        - name: identifier
          in: query
          required: false
          description: An integration identifier.
          schema:
            type: string
        - name: vendor
          in: query
          required: false
          description: An integration vendor.
          schema:
            type: string
      responses:
        '200':
          description: Returns a hub integration.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server:
    get:
      operationId: getServer
      tags:
        - Servers
      parameters: []
      summary: Get Server
      description: |
        Gets the server this instance is running on.

        Requires the `server` scope to be set on the container runtime config.
      x-cycle-scopes:
        - server
      responses:
        '200':
          description: Returns a server.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Server'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server/instances:
    get:
      operationId: getServerInstances
      summary: Get Server Instances
      description: |
        Gets a list of instances that are on the same server as this instance.

        Requires the `server` scope to be set on the container runtime config.
      tags:
        - Servers
        - Instances
      parameters: []
      x-cycle-scopes:
        - server
      responses:
        '200':
          description: Returns a list of instances.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instance'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server/external-volumes:
    get:
      operationId: getServerExternalVolumes
      summary: List Server External Volumes
      description: |
        Lists all external volumes connected to this server.

        Requires the `server` scope to be set on the container runtime config.
      tags:
        - Servers
      parameters: []
      x-cycle-scopes:
        - server
      responses:
        '200':
          description: Returns a list of external volumes.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalVolume'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server/containers:
    get:
      operationId: getServerContainers
      tags:
        - Servers
        - Containers
      parameters: []
      x-cycle-scopes:
        - server
      summary: List Server Containers
      description: |
        Lists all containers present on the same server as this instance.

        Requires the `server` scope to be set on the container runtime config.
      responses:
        '200':
          description: Returns a list of containers.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Container'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server/images:
    get:
      operationId: getServerImages
      summary: List Server Images
      description: |
        Lists all images downloaded onto the server this instance is on.

        Requires the `server` scope to be set on the container runtime config.
      tags:
        - Servers
        - Containers
      parameters: []
      x-cycle-scopes:
        - server
      responses:
        '200':
          description: Returns a list of image details (id, time accessed).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - access_time
                      properties:
                        id:
                          $ref: '#/components/schemas/ID'
                        access_time:
                          $ref: '#/components/schemas/DateTime'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server/images/download:
    post:
      operationId: downloadImage
      summary: Download Image
      description: |
        Downloads the specified image to the server.

        Requires the `server` scope to be set on the container runtime config.
      tags:
        - Servers
        - Images
      parameters: []
      x-cycle-scopes:
        - server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_id
              properties:
                image_id:
                  $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Returns the details of the downloaded image.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - access_time
                      properties:
                        id:
                          $ref: '#/components/schemas/ID'
                        access_time:
                          $ref: '#/components/schemas/DateTime'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server/power/poweroff:
    post:
      operationId: poweroffServer
      summary: Power Off Server
      description: |
        Initiates a graceful poweroff on the host server this instance is running on.

        Does not require a scope, but the container must have `config.runtime.host.power_management` set to true to utilize this endpoint.
      tags:
        - Servers
      parameters: []
      x-cycle-scopes:
        - none
      responses:
        '200':
          description: Returns a generic success result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/server/power/reboot:
    post:
      operationId: rebootServer
      summary: Reboot Server
      description: |
        Initiates a graceful reboot on the host server this instance is running on. 

        Does not require a scope, but the container must have `config.runtime.host.power_management` set to true to utilize this endpoint.
      tags:
        - Servers
      parameters: []
      x-cycle-scopes:
        - none
      responses:
        '200':
          description: Returns a generic success result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/container:
    get:
      operationId: getContainer
      summary: Get Container
      description: |
        Gets a container. By default will grab the container of this instance, but a `container-id`` parameter can be passed to grab any other container in the same environment.

        Requires the `self` scope to be set on the container runtime config.
      tags:
        - Containers
      x-cycle-scopes:
        - self
      parameters:
        - name: container-id
          in: query
          required: false
          description: Specify which container to fetch. If not provided, will use the container of the current instance.
          schema:
            type: string
      responses:
        '200':
          description: Returns a container.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Container'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/container/instances:
    get:
      operationId: getContainerInstances
      summary: Get Container Instances
      description: |
        Gets the instances of a container. By default will grab the instances of the same container, but a `container-id`` parameter can be passed to grab any other container instances in the same environment.

        Requires the `self` scope to be set on the container runtime config.
      tags:
        - Containers
        - Instances
      x-cycle-scopes:
        - self
      parameters:
        - name: container-id
          in: query
          required: false
          description: Specify which container to fetch instances of. If not provided, will use the container of the current instance.
          schema:
            type: string
      responses:
        '200':
          description: Returns a list of instances.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instance'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/containers/certificates:
    get:
      operationId: getContainerCertificates
      summary: List Container Certificates
      description: |
        Get the TLS certificates associated with the domains pointed at this container.

        Requires the `self` scope to be set on the container runtime config.
      tags:
        - Containers
      x-cycle-scopes:
        - self
      parameters:
        - name: container-id
          in: query
          required: false
          description: Specify which container to get certificates for. If not provided, will use the container of the current instance.
          schema:
            type: string
      responses:
        '200':
          description: Returns a list of TLS certificates.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/containers/domains:
    get:
      operationId: getContainerDomains
      summary: List Container Domains
      description: |
        Get the domains pointed at a container.

        Requires the `self` scope to be set on the container runtime config.
      tags:
        - Containers
      x-cycle-scopes:
        - self
      parameters:
        - name: container-id
          in: query
          required: false
          description: Specify which container to get domains for. If not provided, will use the container of the current instance.
          schema:
            type: string
      responses:
        '200':
          description: Returns a list of domains.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: Any associated Linked Records for this container, and their fully-qualified domain name (fqdn).
                      required:
                        - fqdn
                      properties:
                        fqdn:
                          type: string
                          description: The fully qualified domain name.
                        record:
                          $ref: '#/components/schemas/DnsRecord'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/ha/election/checkin:
    post:
      operationId: highAvailabilityCheckin
      summary: High Availability Checkin
      description: |
        Hit this endpoint every 30 seconds to check in and have the platform select and maintain a primary instance.
        Every instance you wish to be considered for a primary should hit this endpoint roughly every 30 seconds. The platform will choose one instance as the primary, and it will continue to be the primary until it stops checking in. If a primary stops checking in, a secondary will be selected to be promoted to primary.

        Does not require a scope, but `config.deploy.ha_elections` must be enabled on this container to access this endpoint.
      tags:
        - High Availability
      x-cycle-scopes:
        - none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - electable
                - priority
              properties:
                electable:
                  type: boolean
                  description: Whether this instance wishes to be considered for election as the primary.
                priority:
                  type: integer
                  format: int32
                  description: The election priority for this instance. Higher priority means more likely to be elected primary.
      responses:
        '200':
          description: Returns the result of the high availability check-in.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - time
                      - primary_instance_id
                    properties:
                      time:
                        description: The time the platform recorded this check-in.
                        $ref: '#/components/schemas/DateTime'
                      primary_instance_id:
                        description: The ID of the instance currently elected as the primary. Null when no primary has been elected yet.
                        oneOf:
                          - $ref: '#/components/schemas/ID'
                          - type: 'null'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/monitoring/metrics:
    post:
      operationId: postMetric
      summary: Post Metric
      description: |
        Post data to Cycle's monitoring system.

        Does not require a scope.
      tags:
        - Monitoring
      x-cycle-scopes:
        - none
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Metric'
      responses:
        '200':
          description: Returns true on success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
                    enum:
                      - true
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/monitoring/events:
    post:
      operationId: postEvent
      summary: Post Event
      description: |
        Post a custom event to Cycle's monitoring system.

        Does not require a scope.
      tags:
        - Monitoring
      x-cycle-scopes:
        - none
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Returns true on success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
                    enum:
                      - true
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sdn/networks:
    get:
      operationId: getNetworks
      summary: List Networks
      description: |
        Lists all networks attached to this instance.

        Requires the `networks` scope to be set on the container runtime config.
      tags:
        - SDN
      parameters: []
      x-cycle-scopes:
        - networks
      responses:
        '200':
          description: Returns a list of networks.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Network'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sdn/networks/instances:
    get:
      operationId: getNetworkInstances
      summary: List Network Instances
      description: |
        Lists all instances present in this instance's SDN networks.

        Requires the `networks` scope to be set on the container runtime config.
      tags:
        - SDN
        - Instances
      parameters: []
      x-cycle-scopes:
        - networks
      responses:
        '200':
          description: Returns a list of instances.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instance'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sdn/networks/environments:
    get:
      operationId: getNetworkEnvironments
      summary: List Network Environments
      description: |
        Lists all environments present in this instance's SDN networks.

        Requires the `networks` scope to be set on the container runtime config.
      tags:
        - SDN
        - Environments
      parameters: []
      x-cycle-scopes:
        - networks
      responses:
        '200':
          description: Returns a list of environments.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Environment'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/virtual-machine:
    get:
      operationId: getVirtualMachine
      summary: Get Virtual Machine
      description: |
        Returns a specified virtual machine.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Virtual Machines
      x-cycle-scopes:
        - environment
      parameters:
        - name: virtual-machine-id
          in: query
          required: true
          description: Specify which virtual machine to fetch.
          schema:
            type: string
      responses:
        '200':
          description: Returns a virtual machine.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/VirtualMachine'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/virtual-machine/domains:
    get:
      operationId: getVirtualMachineDomains
      summary: Get Virtual Machine Domains
      description: |
        Returns the domains associated with the specified virtual machine.

        Requires the `environment` scope to be set on the container runtime config.
      tags:
        - Virtual Machines
      x-cycle-scopes:
        - environment
      parameters:
        - name: virtual-machine-id
          in: query
          required: true
          description: Specify which virtual machine to fetch domains for.
          schema:
            type: string
      responses:
        '200':
          description: Returns a list of virtual machine domains.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - fqdn
                      properties:
                        fqdn:
                          type: string
                        record:
                          anyOf:
                            - $ref: '#/components/schemas/DnsRecord'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/object-cache:
    get:
      operationId: getObjectCache
      summary: Get Object Cache
      description: |
        Returns an object saved to the internal object cache.

        Requires the `server` scope to be set on the container runtime config if using the `global` cache.
        Requires the `environment` scope to be set on the container runtime config if using the `environment` cache.
        Requires the `self` scope to be set on the container runtime config if using the `container` or `instance` cache.
      tags:
        - Object Cache
      x-cycle-scopes:
        - server
        - environment
        - self
      parameters:
        - name: scope
          in: query
          required: true
          description: Specify the object scope.
          schema:
            type: string
            enum:
              - global
              - environment
              - container
              - instance
        - name: key
          in: query
          required: true
          description: Specify the object key.
          schema:
            type: string
      responses:
        '200':
          description: Returns a saved object cache item.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ObjectCacheSave'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      operationId: postObjectCache
      summary: Post Object Cache
      description: |
        Save an item to the internal API object cache.

        Requires the `server` scope to be set on the container runtime config if using the `global` cache.
        Requires the `environment` scope to be set on the container runtime config if using the `environment` cache.
        Requires the `self` scope to be set on the container runtime config if using the `container` or `instance` cache.
      tags:
        - Object Cache
      parameters: []
      x-cycle-scopes:
        - server
        - environment
        - self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectCacheSave'
      responses:
        '200':
          description: Returns true on success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: 'null'
        default:
          $ref: '#/components/responses/DefaultError'
