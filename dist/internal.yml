            - request_invalid
            - timeout_idle
            - router_none
            - router_nomatch
            - destination_unavailable
            - unknown_error
          properties:
            no_error:
              type: integer
            request_invalid:
              type: integer
            timeout_idle:
              type: integer
            router_none:
              type: integer
            router_nomatch:
              type: integer
            destination_unavailable:
              type: integer
            unknown_error:
              type: integer
        connections:
          type: integer
        requests:
          type: integer
        bytes_transmitted:
          type: integer
        bytes_received:
          type: integer
    LoadBalancerTelemetrySnapshot:
      title: LoadBalancerTelemetrySnapshot
      type: object
      required:
        - time
        - started
        - dataset_id
        - current
        - cumulative
      properties:
        time:
          $ref: '#/components/schemas/DateTime'
        started:
          $ref: '#/components/schemas/DateTime'
        version:
          type: string
        dataset_id:
          type: integer
        current:
