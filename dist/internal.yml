        discovery:
          anyOf:
            - $ref: '#/components/schemas/DiscoveryEnvironmentService'
            - type: 'null'
        vpn:
          anyOf:
            - $ref: '#/components/schemas/VpnEnvironmentService'
            - type: 'null'
        scheduler:
          anyOf:
            - $ref: '#/components/schemas/SchedulerEnvironmentService'
            - type: 'null'
        gateway:
          anyOf:
            - $ref: '#/components/schemas/GatewayEnvironmentService'
            - type: 'null'
    ACL:
      title: ACL
      description: An access control list. Defines which roles have which permissions on specific resources.
      type: object
      properties:
        roles:
          type: object
          additionalProperties:
            type: object
            title: ACLEntry
            description: Permissions for an ACL entry.
            required:
              - view
              - modify
              - manage
            properties:
              view:
                type: boolean
                description: Can the user see / use this resource?
              modify:
                type: boolean
                description: Can the user edit the state / name / identifier of this resource?
              manage:
                type: boolean
                description: Can the user delete / update ACLs for this resource?
    IPNet:
      title: IPNet
      type: object
      required:
        - ip
        - cidr
      properties:
        ip:
          type: string
          description: The IP address.
          examples:
            - fd00::21:0:0:0
        cidr:
          type: string
          description: The CIDR notation, describing the range of IP addresses.
          examples:
            - fd00::21:0:0:0/96
    LegacyNetwork:
      title: LegacyNetwork
      type: object
      description: Legacy network information for an environment.
      required:
        - subnet
      properties:
        subnet:
          type: integer
          description: The IPv4 subnet id.
        ipv4:
          description: IPv4 information available from environments using legacy networking.
          anyOf:
            - $ref: '#/components/schemas/IPNet'
            - type: 'null'
    PrivateNetwork:
      title: PrivateNetwork
      type: object
      required:
        - vxlan_tag
        - subnet
        - ipv6
        - legacy
      properties:
        vxlan_tag:
          type: integer
          description: The vxlan tag added to each packet to help identify the network.
        subnet:
          type: string
          description: The subnet ID.
        ipv6:
          allOf:
            - description: The IPv6 interface.
            - $ref: '#/components/schemas/IPNet'
        legacy:
          anyOf:
            - $ref: '#/components/schemas/LegacyNetwork'
            - type: 'null'
    Version:
      title: Version
      type: string
      description: |
        Version can be any string, but if it begins with a "v", semantic version will be enforced. A [Semantic Version](https://semver.org/) string. Follows the format vMAJOR.MINOR.PATCH-build.
      examples:
        - v1.2.3-dev
    EnvironmentDeploymentTags:
      title: EnvironmentDeploymentTags
      type: object
      description: |
        A map of custom tags to deployment versions. Allows for defining a custom, persistent tag with a changing version number. 
        For example, `dev -> v1.2.3-dev`. This is useful when dealing with DNS LINKED records, where you always want dev.example.com to point to the 
        `dev` version of your app within an environment, where you can continuously deploy and update it without needing to change the record. It is 
        even more useful when you have multiple LINKED records, and you update i.e. `prod`` tag to point to a new version, all records using the `prod` tag
        are switched at once.
      additionalProperties:
        $ref: '#/components/schemas/Version'
    StateCountSummary:
      title: ResourceCountSummary
      type: object
      description: A summary of resources by state
      required:
        - state
        - total
        - available
      properties:
        state:
          title: CountsByState
          type: object
          description: A count of this resource, grouped by state.
          additionalProperties:
            type: integer
        total:
          type: integer
          description: The total number of this resource
        available:
          type: integer
          description: The total number of this resource available, less any deleted ones.
      example:
        state:
          new: 0
          starting: 0
          running: 5
          stopping: 0
          deleting: 0
          deleted: 0
        total: 5
        available: 5
    ContainerState:
      title: ContainerState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the container.
              type: string
              enum:
                - new
                - starting
                - running
                - function
                - stopping
                - stopped
                - deleting
                - deleted
            desired:
              description: The desired state of the container.
              type: string
              enum:
                - new
                - starting
                - running
                - function
                - stopping
                - stopped
                - deleting
                - deleted
        - $ref: '#/components/schemas/State'
    ContainerImageSummary:
      title: ContainerImageSummary
      description: The Id of the image and information on if it is a service.
      type: object
      required:
        - id
        - service
      properties:
        id:
          $ref: '#/components/schemas/ID'
        service:
          anyOf:
            - type: string
              description: If this image is a service container this will say either `discovery` | `loadbalancer` | `vpn`.
              enum:
                - discovery
                - loadbalancer
                - vpn
            - type: 'null'
    ContainerEnvironmentSummary:
      title: ContainerEnvironmentSummary
      description: A summary of supplemental environment and network information specific to a container.
      type: object
      required:
        - id
        - cluster
      properties:
        id:
          $ref: '#/components/schemas/ID'
        cluster:
          type: string
          description: The cluster this environment is associated with.
        container_subnet:
          type:
            - string
            - 'null'
          description: The private network subnet ID for this container and its instances.
        ipv6:
          anyOf:
            - $ref: '#/components/schemas/IPNet'
            - type: 'null'
        legacy:
          anyOf:
            - $ref: '#/components/schemas/LegacyNetwork'
            - type: 'null'
    EnvironmentMeta:
      title: EnvironmentMeta
      type: object
      description: A list of meta fields that can be applied to this environment.
      properties:
        containers_count:
          $ref: '#/components/schemas/StateCountSummary'
        instances_count:
          $ref: '#/components/schemas/StateCountSummary'
        containers:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - state
              - image
              - environment
            properties:
              id:
                $ref: '#/components/schemas/ID'
              name:
                type: string
                description: A user defined name for the container resource.
              state:
                $ref: '#/components/schemas/ContainerState'
              image:
                $ref: '#/components/schemas/ContainerImageSummary'
              environment:
                $ref: '#/components/schemas/ContainerEnvironmentSummary'
        service_versions:
          description: A map where the key is the service and the value describes the version and date of last update.
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required:
                - version
                - last_updated
              properties:
                version:
                  description: A string depicting the service version.
                  example: v2025.01.01.01
                  type: string
                instance_id:
                  description: The ID of the instance of the service.
                  $ref: '#/components/schemas/ID'
                last_updated:
                  description: The time the version was last updated.
                  $ref: '#/components/schemas/DateTime'
    Environment:
      title: Environment
      type: object
      description: Environments are groups of containers with a private network built between them. For more information on environments, see the [main docs](https://cycle.io/docs/platform/introduction-to-environments).
      required:
        - id
        - identifier
        - name
        - cluster
        - about
        - creator
        - hub_id
        - state
        - events
        - features
        - services
      properties:
        id:
          $ref: '#/components/schemas/ID'
        identifier:
          $ref: '#/components/schemas/Identifier'
          description: A human readable slugged identifier for this environment.
        name:
          type: string
          description: A user defined name for the environment resource.
        cluster:
          type: string
          description: The cluster this environment is associated with.
        about:
          $ref: '#/components/schemas/EnvironmentAbout'
        creator:
          $ref: '#/components/schemas/CreatorScope'
        hub_id:
          $ref: '#/components/schemas/HubID'
        state:
          $ref: '#/components/schemas/EnvironmentState'
        events:
          title: EnvironmentEvents
          type: object
          description: A collection of timestamps for each event in the environment's lifetime.
          required:
            - created
            - updated
            - deleted
          properties:
            created:
              description: The timestamp of when the environment was created.
              $ref: '#/components/schemas/DateTime'
            updated:
              description: The timestamp of when the environment was updated.
              $ref: '#/components/schemas/DateTime'
            deleted:
              description: The timestamp of when the environment was deleted.
              $ref: '#/components/schemas/DateTime'
        features:
          $ref: '#/components/schemas/EnvironmentFeatures'
        services:
          $ref: '#/components/schemas/EnvironmentServices'
        acl:
          anyOf:
            - $ref: '#/components/schemas/ACL'
            - type: 'null'
        private_network:
          anyOf:
            - $ref: '#/components/schemas/PrivateNetwork'
            - type: 'null'
        deployments:
          description: |
            A map of custom tags to deployment versions.
          oneOf:
            - type: object
              required:
                - tags
              properties:
                tags:
                  $ref: '#/components/schemas/EnvironmentDeploymentTags'
            - type: 'null'
        meta:
          $ref: '#/components/schemas/EnvironmentMeta'
    ContainerExtension:
      title: ContainerExtension
      type:
        - object
        - 'null'
      description: Reference to container functionality that is added by the Cycle platform.
      required:
        - identifier
      properties:
        identifier:
          type: string
          enum:
            - virtual-machine-v1
        id:
          $ref: '#/components/schemas/ID'
    ServiceContainerIdentifier:
      title: ServiceContainerIdentifier
      type: string
      description: Identifier of a service Container within an Environment.
      enum:
        - discovery
        - vpn
        - loadbalancer
        - scheduler
        - gateway
    ImageSummary:
      title: ContainerImageSummary
      description: A summary of the image this container was created from.
      type: object
      required:
        - id
        - service
        - extension
      properties:
        id:
          anyOf:
            - $ref: '#/components/schemas/ID'
            - type: 'null'
        extension:
          anyOf:
            - $ref: '#/components/schemas/ContainerExtension'
            - type: 'null'
        service:
          anyOf:
            - $ref: '#/components/schemas/ServiceContainerIdentifier'
            - type: 'null'
          description: If a service container, the identifier specifying which service it is.
    StackSummary:
      title: ContainerStackSummary
      description: A summary of the stack this container was created format.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        build_id:
          type: string
          description: The ID of the stack build this container is associated with.
        identifier:
          type: string
          description: The container identifier, usually the key to the container section of a stack file.
    Cidr:
      title: Cidr
      type: string
      format: cidr
      description: |
        A CIDR (Classless Inter-Domain Routing) string is a notation used to represent an IP address and its associated network prefix. 
        It combines an IP address with a suffix that indicates how many bits are fixed for routing.
      examples:
        - 192.168.1.0/24
    IpAddress:
      title: IpAddress
      type: string
      format: ip-address
      description: |
        An IP address is a numerical label that uniquely identifies a device on a network and enables it to send and receive data.
      examples:
        - 192.168.1.1
    NetworkRouteConfigNexthop:
      title: NetworkRouteConfigNexthop
      type: object
      description: A single next hop for a multipath network route.
      required:
        - gateway
      properties:
        gateway:
          description: The IP address of this next hop's gateway.
          $ref: '#/components/schemas/IpAddress'
        hop_weight:
          description: The relative weight of this next hop when distributing traffic across multiple next hops.
          oneOf:
            - type: integer
              format: int64
            - type: 'null'
    NetworkRouteConfig:
      title: NetworkRouteConfig
      type: object
      description: A single network route directing traffic for a destination network.
      required:
        - destination
        - source
        - ensure_source_exists
        - gateway
        - interface
      properties:
        destination:
          description: The destination network, in CIDR notation, that this route matches.
          oneOf:
            - $ref: '#/components/schemas/Cidr'
            - type: 'null'
        source:
          description: The source network, in CIDR notation, that this route applies to.
          oneOf:
            - $ref: '#/components/schemas/Cidr'
            - type: 'null'
        ensure_source_exists:
          type: boolean
          description: When true, the source address is verified to exist on the host before this route is applied.
        family:
          description: The IP protocol family this route applies to.
          oneOf:
            - type: string
              enum:
                - ipv4
                - ipv6
            - type: 'null'
        gateway:
          description: The IP address that traffic matching the destination is forwarded to.
          $ref: '#/components/schemas/IpAddress'
        nexthops:
          type: array
          description: Additional next hops for this route, used for multipath (ECMP) routing.
          items:
            $ref: '#/components/schemas/NetworkRouteConfigNexthop'
        interface:
          type: string
          description: The name of the network interface this route is bound to.
    L2Domain:
      title: L2Domain
      description: |
        A standardized name for different layer-2 networks that can be configured on virtual provider hosts.
         Containers will utilize this name to determine which network to attach to on the host, if set in the config.
      type: string
      enum:
        - public
        - shared
        - private
    ContainerNetwork:
      title: ContainerNetwork
      type: object
      description: Network configuration for a container.
      required:
        - public
        - egress_via_gateway
        - routes
        - hostname
      properties:
        public:
          type: string
          description: The public network settings for the given container.
          enum:
            - enable
            - egress-only
            - environment-limited
            - disable
        egress_via_gateway:
          type: boolean
          description: When true, the container's egress traffic is routed out through the environment gateway.
        routes:
          type:
            - array
            - 'null'
          description: Custom network routes applied to the container's instances.
          items:
            $ref: '#/components/schemas/NetworkRouteConfig'
        hostname:
          type: string
          description: The hostname for the given container.
        ports:
          type: array
          items:
            type: string
          description: An array of port mappings for the container.
        l2:
          description: Layer 2 network configuration options for containers running on virtual provider servers.
          oneOf:
            - type: object
              required:
                - domains
              properties:
                domains:
                  type: array
                  description: |
                    The layer 2 'domains' that this container's instances should bridge to on the host server. 
                    If the host has a matching layer 2 NIC configured via a virtual provider ISO, this container's instances 
                    will be joined directly to the host's network.
                  items:
                    $ref: '#/components/schemas/L2Domain'
    DeploymentStrategyName:
      title: DeploymentStrategyName
      type: string
      enum:
        - resource-density
        - high-availability
        - distributed
        - first-available
        - manual
        - node
        - edge
        - function
    ContainerDeployHighAvailabilityConfig:
      title: ContainerDeployHighAvailabilityConfig
      description: Configuration options for how the platform treats instances of this container when opting into high availability via the internal API.
      required:
        - stale_primary_deadline
      properties:
        stale_primary_deadline:
          description: The amount of time that must pass between high availability checkins before an instance is considered stale. If it is the primary, a new primary will be elected after this deadline. Minimum is 15s.
          $ref: '#/components/schemas/Duration'
    Crontab:
      title: Crontab
      type: string
      format: crontab
      description: |
        A crontab string defines a recurring schedule.

        In standard form it consists of five space-separated fields specifying, in
        order, the minute (0-59), hour (0-23), day of the month (1-31), month
        (1-12), and day of the week (0-6, where 0 is Sunday). Each field accepts a
        specific value, a wildcard (`*`), a range (`1-5`), a list (`1,15,30`), or a
        step (`*/5`).

        An optional leading seconds field (0-59) may be included, producing a
        six-field form.

        Predefined macros are also accepted in place of the fields: `@yearly`
        (equivalent to `@annually`), `@monthly`, `@weekly`, `@daily` (equivalent to
        `@midnight`), and `@hourly`, as well as `@every <duration>` where duration
        is a duration string such as `5m` or `1h30m`.
      examples:
        - '*/5 * * * *'
        - 0 0 * * *
        - 30 9 * * 1-5
        - '*/30 * * * * *'
        - '@daily'
        - '@every 5m'
    ShutdownSignal:
      title: ShutdownSignal
      type: string
      description: Process signals that Cycle can be configured to send to the container on a shutdown event.
      enum:
        - SIGTERM
        - SIGINT
        - SIGUSR1
        - SIGUSR2
        - SIGHUP
        - SIGQUIT
    ContainerDeploy:
      title: ContainerDeploy
      type: object
      description: Deployment configuration for the given container.
      required:
        - instances
      properties:
        instances:
          type: integer
          description: The number of initial desired instances for a given container.
        strategy:
          oneOf:
            - $ref: '#/components/schemas/DeploymentStrategyName'
            - type: 'null'
          description: The deployment strategy to use when scaling the given container.
        ha_elections:
          description: Configuration options for how the platform treats instances of this container when opting into high availability elections via the internal API.
          oneOf:
            - $ref: '#/components/schemas/ContainerDeployHighAvailabilityConfig'
            - type: 'null'
        function:
          description: Configuration options for containers using the 'function' deployment strategy.
          oneOf:
            - type: object
              properties:
                max_pool_size:
                  description: The maximum number of instances that Cycle can pre-allocate (includes auto-scaled instances).
                  type:
                    - integer
                    - 'null'
                max_shard_concurrency:
                  description: For each shard (scheduler), the maximum number of tasks it can run in parallel.
                  type:
                    - integer
                    - 'null'
                max_runtime:
                  anyOf:
                    - $ref: '#/components/schemas/Duration'
                    - type: 'null'
                  description: The maximum amount of time a function instance can run before timing out.
                max_queue_time:
                  anyOf:
                    - $ref: '#/components/schemas/Duration'
                    - type: 'null'
                  description: The maximum amount of time Cycle will wait for an instance to be available.
                schedule:
                  anyOf:
                    - $ref: '#/components/schemas/Crontab'
                    - type: 'null'
                  description: A recurring schedule on which function instances are automatically triggered. When null, the function runs only on explicit invocation.
            - type: 'null'
        stateful:
          description: Configuration options for stateful deployments.
          oneOf:
            - type: object
              properties:
                options:
                  description: Options that modify behavior for stateful deployments.
                  oneOf:
                    - type: object
                      properties:
                        use_base_hostname:
                          description: When set, the base hostname will be used instead of a generated hostname.
                          type:
                            - boolean
                            - 'null'
                    - type: 'null'
            - type: 'null'
        constraints:
          description: Settings that give more granular control over deployment targets and conditions.
          oneOf:
            - type: object
              properties:
                node:
                  oneOf:
                    - type: object
                      description: Constraint settings related to which nodes an instance can be deployed to.
                      required:
                        - tags
                      properties:
                        tags:
                          type: object
                          description: Lists of server tags that formally declair servers that match the criteria for deployment.
                          properties:
                            any:
                              type:
                                - array
                                - 'null'
                              items:
                                type: string
                              description: A list of tags where a server matching any tags from the list is qualified as a deployment target.
                            all:
                              type:
                                - array
                                - 'null'
                              items:
                                type: string
                              description: A list of tags where a server matching all tags from the list is the only scenario where the server is qualified as a deployment target.
                    - type: 'null'
                secrets:
                  description: A list of secret identifiers that will be made available to the container.
                  type:
                    - array
                    - 'null'
                  items:
                    type: string
            - type: 'null'
        shutdown:
          description: Configuration for what to do during container shutdown.
          oneOf:
            - type: object
              properties:
                graceful_timeout:
                  anyOf:
                    - $ref: '#/components/schemas/Duration'
                    - type: 'null'
                  description: How long the platform will wait for a container to stop gracefully.
                signals:
                  type:
                    - array
                    - 'null'
                  items:
                    $ref: '#/components/schemas/ShutdownSignal'
                  description: Process signal sent to the container process.
            - type: 'null'
        startup:
          description: Configurations for container startup.
          oneOf:
            - type: object
              properties:
                delay:
                  $ref: '#/components/schemas/Duration'
                  description: How long the platform will wait before sending the start signal to the given container.
            - type: 'null'
        update:
          description: Configurations for container updates.
          oneOf:
            - type: object
              properties:
                stagger:
                  $ref: '#/components/schemas/Duration'
                  description: When set, Cycle will pick a random time from `0 - this duration`, and stagger the instances so they all start at different times (up to the time specified here).
            - type: 'null'
        restart:
          description: Configurations for container restart events.
          oneOf:
            - type: object
              required:
                - condition
                - delay
                - max_attempts
              properties:
                condition:
                  type: string
                  description: Policy for what should happen in the event of a container dying.
                  enum:
                    - always
                    - never
                    - failure
                delay:
                  $ref: '#/components/schemas/Duration'
                  description: How long the platform will wait before trying to restart the container.
                max_attempts:
                  type: integer
                  description: The amount of times the platform will attempt the restart policies.
            - type: 'null'
        readiness_check:
          description: Configuration for determining readiness of a container.
          oneOf:
            - type: object
              required:
                - command
                - interval
                - timeout
              properties:
                command:
                  type: string
                  description: The command that will be run to verify readiness of the container.
                interval:
                  $ref: '#/components/schemas/Duration'
                timeout:
                  $ref: '#/components/schemas/Duration'
            - type: 'null'
        health_check:
          description: Configuration for determining the health of a container.
          oneOf:
            - type: object
              required:
                - command
                - retries
                - delay
                - interval
                - timeout
                - restart
              properties:
                command:
                  type: string
                  description: The command that will be run to verify the health of the container.
                retries:
                  type: integer
                  description: The number of times the platform will retry the command before marking the container unhealthy.
                delay:
                  $ref: '#/components/schemas/Duration'
                  description: How long to wait before performing an initial health check when the instance starts. The `state.health.healthy` field of the instance will be `null`` until the first check is performed.
                interval:
                  $ref: '#/components/schemas/Duration'
                  description: How long to wait between restarts.
                timeout:
                  $ref: '#/components/schemas/Duration'
                  description: How long before a health check attempt times out.
                restart:
                  type: boolean
                  description: A boolean where `true` represents the desire for a container to restart if unhealthy.
            - type: 'null'
        telemetry:
          description: Configuration settings for container telemetery reporting.
          oneOf:
            - type: object
              required:
                - retention
                - interval
                - disable
              properties:
                retention:
                  $ref: '#/components/schemas/Duration'
                  description: How long telemetry data should be retained.
                interval:
                  $ref: '#/components/schemas/Duration'
                  description: The duration between samples.
                disable:
                  type: boolean
                  description: A boolean where true disables all telemetry reporting for this container.
            - type: 'null'
    ScaleThresholdMetricRam:
      title: ScaleThresholdMetricRam
      type: object
      description: Describes the RAM threshold at which scaling will occur.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - ram
        details:
          type: object
          required:
            - usage
          properties:
            usage:
              type: string
              description: The target average RAM usage of all instances of this container. Going above this threshold will trigger a scaling event. This threshold must be greater than 25MB.
              examples:
                - 2G
                - 25MB
    ScaleThresholdMetricCpu:
      title: ScaleThresholdMetricCpu
      type: object
      description: Describes the CPU threshold at which scaling will occur
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - cpu
        details:
          type: object
          required:
            - utilization
          properties:
            utilization:
              type: integer
    WebhookURL:
      title: WebhookURL
      type: string
      description: |
        A URL describing the destination Cycle should send a POST webhook payload to.
      examples:
        - https://example.com/cycle/autoscale
    ScaleThresholdMetricCustom:
      title: ScaleThresholdMetricCustom
      type: object
      description: A custom threshold for defining a scaling event.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - custom
        details:
          type: object
          required:
            - webhook
          properties:
            webhook:
              $ref: '#/components/schemas/WebhookURL'
    ScaleThresholdMetricNetworkConnections:
      title: ScaleThresholdMetricNetworkConnections
      type: object
      description: Describes the network connections threshold at which scaling will occur
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - network-connections
        details:
          type: object
          required:
            - connections
          properties:
            connections:
              type: integer
    ScaleThresholdMetricNetworkRequests:
      title: ScaleThresholdMetricNetworkRequests
      type: object
      description: Describes the network requests threshold at which scaling will occur
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - network-requests
        details:
          type: object
          required:
            - requests
          properties:
            requests:
              type: integer
    ScaleThresholdMetricNetworkThroughput:
      title: ScaleThresholdMetricNetworkThroughput
      type: object
      description: Describes the network throughput threshold at which scaling will occur
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - network-throughput
        details:
          type: object
          required:
            - private
            - bandwidth
          properties:
            private:
              type: boolean
            bandwidth:
              type: string
              description: The limit (maximum) amount of throughput each instance of the given container can use before triggering a scaling event.
              examples:
                - 1gbps
                - 20mbps
    ScaleThresholdMetric:
      title: ScaleThresholdMetric
      type: object
      description: Discriminated union describing the different types of scaling threshold and their respective details
      discriminator:
        propertyName: type
        mapping:
          ram: '#/components/schemas/ScaleThresholdMetricRam'
          cpu: '#/components/schemas/ScaleThresholdMetricCpu'
          custom: '#/components/schemas/ScaleThresholdMetricCustom'
          network-connections: '#/components/schemas/ScaleThresholdMetricNetworkConnections'
          network-requests: '#/components/schemas/ScaleThresholdMetricNetworkRequests'
          network-throughput: '#/components/schemas/ScaleThresholdMetricNetworkThroughput'
      oneOf:
        - $ref: '#/components/schemas/ScaleThresholdMetricRam'
        - $ref: '#/components/schemas/ScaleThresholdMetricCpu'
        - $ref: '#/components/schemas/ScaleThresholdMetricNetworkConnections'
        - $ref: '#/components/schemas/ScaleThresholdMetricNetworkRequests'
        - $ref: '#/components/schemas/ScaleThresholdMetricNetworkThroughput'
        - $ref: '#/components/schemas/ScaleThresholdMetricCustom'
    ContainerScale:
      title: ContainerScale
      type: object
      description: Network configuration for a container.
      required:
        - autoscale_group
        - instances
        - window
        - thresholds
      properties:
        autoscale_group:
          type:
            - string
            - 'null'
          description: The autoscaling group describes which servers should be deployed
        instances:
          type: object
          description: Describes how many instances should be running
          required:
            - max
            - max_server
            - min_ttl
          properties:
            max:
              type: integer
              description: Maximum additional instances the auto-scaler will run at any time
            max_server:
              type: integer
              description: Minimum number of instances per server
            min_ttl:
              $ref: '#/components/schemas/Duration'
              description: Minimum amount of time an instance will live
        window:
          description: Duration in which the auto-scaler will watch for changes
          $ref: '#/components/schemas/Duration'
        thresholds:
          description: An array of rules that dictate when a scaling event will be triggered
          type: array
          items:
            $ref: '#/components/schemas/ScaleThresholdMetric'
    RuntimeInternalApi:
      title: RuntimeInternalApi
      description: Configuration options for the internal API access within instances of this container.
      type: object
      properties:
        scope:
          oneOf:
            - type: array
              description: Scopes determine which set of endpoints instances of this container can reach over the internal API.
              items:
                type: string
                enum:
                  - self
                  - environment
                  - networks
                  - server
                  - notifications
            - type: 'null'
    SeccompRule:
      title: SeccompRule
      description: Rules for controlling Linux seccomp inside a container.
      type: object
      properties:
        capabilities:
          type: object
          properties:
            includes:
              type: string
            excludes:
              type: string
        syscall:
          type: object
          description: LinuxSyscall is used to match a syscall in Seccomp
          required:
            - names
            - action
          properties:
            names:
              type: array
              items:
                type: string
            action:
              type: string
            errnoRet:
              type: integer
            args:
              type: array
              items:
                type: object
                required:
                  - index
                  - value
                  - op
                properties:
                  index:
                    type: integer
                  value:
                    type: integer
                  valueTwo:
                    type: integer
                  op:
                    type: string
    RuntimeExposedDevice:
      title: RuntimeExposedDevice
      type: object
      description: A host device exposed to the container during runtime.
      required:
        - source
        - destination
      properties:
        source:
          type: string
          description: The path to the device on the host.
          examples:
            - /dev/kvm
            - /dev/net/tun
        destination:
          type: string
          description: The path inside the container that the device is mapped to.
          examples:
            - /dev/kvm
            - /dev/net/tun
        options:
          anyOf:
            - type: array
              description: Options passed when mounting the device.
              items:
                type: string
                examples:
                  - rbind
                  - ro
            - type: 'null'
    RuntimeDevicePermissionType:
      title: RuntimeDevicePermissionType
      type: string
      description: |
        The class of device this rule applies to (for example, block devices or character devices).
      enum:
        - b
        - c
    RuntimeDevicePermissionAccess:
      title: RuntimeDevicePermissionAccess
      type: string
      description: |
        The access mode permitted by this rule. Common conventions use a combination of letters (e.g., r, w, m) to indicate read, write, and mknod capabilities.
      pattern: ^[rwm]+$
      examples:
        - r
        - rw
        - rwm
    RuntimeDevicePermission:
      title: RuntimeDevicePermission
      type: object
      description: |
        A rule that grants or denies access to a device node (e.g., Linux cgroup device rule). Controls which device type and major/minor numbers are allowed, and with what access.
      required:
        - type
        - allow
        - access
      properties:
        type:
          $ref: '#/components/schemas/RuntimeDevicePermissionType'
        major:
          description: |
            Device major number.
          type:
            - integer
            - 'null'
          format: int64
        minor:
          description: |
            Device minor number.
          type:
            - integer
            - 'null'
          format: int64
        allow:
          type: boolean
          description: Whether this rule allows (true) or denies (false) access.
        access:
          $ref: '#/components/schemas/RuntimeDevicePermissionAccess'
    ContainerRuntime:
      title: ContainerRuntime
      type: object
      description: Runtime configurations for a given container.
      required:
        - privileged
      properties:
        command:
          description: A command that will be run in place of the images defined startup command.
          oneOf:
            - type: object
              properties:
                path:
                  type:
                    - string
                    - 'null'
                  description: System path for the command.
                args:
                  type:
                    - string
                    - 'null'
                  description: Arguments to pass to the command.
            - type: 'null'
        namespaces:
          type: array
          items:
            type: string
            enum:
              - ipc
              - pid
              - uts
              - network
              - mount
              - user
              - cgroup
          description: Namespaces the given container will have access to.
        environment_vars:
          type: object
          description: A record of environment variables for the given container.
          additionalProperties:
            type: string
        privileged:
          type: boolean
          description: Selecting this option will give this container full permissions on the server. This is not recommended and increases the likelihood of your server being compromised.
        capabilities:
          type: array
          items:
            type: string
            enum:
              - CAP_CHOWN
              - CAP_FSETID
              - CAP_DAC_OVERRIDE
              - CAP_FOWNER
              - CAP_SETFCAP
              - CAP_SETGID
              - CAP_SETUID
              - CAP_KILL
              - CAP_MKNOD
              - CAP_NET_BIND_SERVICE
              - CAP_NET_RAW
              - CAP_AUDIT_WRITE
              - CAP_SYS_CHROOT
              - CAP_SETPCAP
              - CAP_DAC_READ_SEARCH
              - CAP_NET_ADMIN
              - CAP_NET_BROADCAST
              - CAP_SYS_ADMIN
              - CAP_SYS_MODULE
              - CAP_SYS_NICE
              - CAP_SYS_PACCT
              - CAP_SYS_PTRACE
              - CAP_SYS_RAWIO
              - CAP_SYS_RESOURCE
              - CAP_SYS_BOOT
              - CAP_SYS_TIME
              - CAP_SYS_TTY_CONFIG
              - CAP_SYSLOG
              - CAP_AUDIT_CONTROL
              - CAP_AUDIT_READ
              - CAP_IPC_LOCK
              - CAP_IPC_OWNER
              - CAP_LINUX_IMMUTABLE
              - CAP_MAC_ADMIN
              - CAP_MAC_OVERRIDE
              - CAP_BLOCK_SUSPEND
              - CAP_LEASE
              - CAP_WAKE_ALARM
          description: A list of linux kernel capabilites for the given container.
        internal_api:
          $ref: '#/components/schemas/RuntimeInternalApi'
        workdir:
          type: string
          description: Configure the working directory for the given container.
        sysctl:
          type: object
          description: A record of sysctl fields and values for a given container.
          additionalProperties:
            type: string
        rlimits:
          type: object
          description: A record of rlimits and their values.
          additionalProperties:
            type: object
            properties:
              hard:
                type: integer
                description: The hard limit for the rlimit.
              soft:
                type: integer
                description: The soft limit for the rlimit.
        seccomp:
          oneOf:
            - type: object
              properties:
                disable:
                  type: boolean
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/SeccompRule'
            - type: 'null'
        host:
          oneOf:
            - type: object
              properties:
                expose_proc:
                  description: If true, Cycle will mount the `/proc` directory into the container, giving it access to the host metrics. This is useful if you're running i.e. a monitoring agent.
                  type:
                    - boolean
                    - 'null'
                expose_cgroups:
                  description: If true, Cycle will mount the host's `/sys/fs/cgroups` directory into the container at `/var/run/cycle/host/cgroups`.
                  type:
                    - boolean
                    - 'null'
                expose_instances_dir:
                  description: If true, Cycle will mount the host's instances directory into the container at `/var/run/cycle/host/instances`.
                  type:
                    - boolean
                    - 'null'
                power_management:
                  description: If true, Cycle will give the container instances access via internal api to power off or reboot the host server.
                  type:
                    - boolean
                    - 'null'
            - type: 'null'
        rootfs:
          type: object
          properties:
            readonly:
              description: Enabling this option will set the containers filesystem to readonly. Volumes associated with the container will not be affected by this.
              type: boolean
        devices:
          oneOf:
            - type: object
              properties:
                shm_size:
                  type:
                    - string
                    - 'null'
                  description: The size of the shared host memory device (/dev/shm).
                  examples:
                    - 64M
                    - 128M
                    - 512M
                expose:
                  anyOf:
                    - type: array
                      description: An array of devices to expose to the container.
                      items:
                        $ref: '#/components/schemas/RuntimeExposedDevice'
                    - type: 'null'
                permissions:
                  anyOf:
                    - type: array
                      description: Rules for granting or denying access to a device node.
                      items:
                        $ref: '#/components/schemas/RuntimeDevicePermission'
                    - type: 'null'
            - type: 'null'
    ContainerResources:
      title: ContainerResources
      type: object
      description: Configuration settings for the resource allocations and limits of a given container.
      required:
        - cpu
        - ram
      properties:
        cpu:
          type: object
          description: Configurations settings related to CPU usage.
          properties:
            shares:
              type: object
              description: A share represents 1/10th of the available compute time on a single thread.
              required:
                - limit
                - reserve
              properties:
                limit:
                  type: integer
                  description: The limit (maximum) amount of shares each instance of a container can use.
                reserve:
                  type: integer
                  description: The reserve (allocation) number of shares for each instance of a given container.
            cpus:
              type: string
        ram:
          type: object
          description: Configuration settings for limits and reserves of RAM resources for the given container.
          properties:
            limit:
              type: string
              description: The limit (maximum) amount of RAM each instance of the given container can use.
              examples:
                - 1G
                - 1M
            reserve:
              type: string
              description: The reserve (allocation) of RAM given to each instance of the container.
    ContainerIntegrations:
      title: ContainerIntegrations
      type: object
      description: Configuration settings for integrations with a given container.
      properties:
        webhooks:
          type: object
          description: Webhooks that can be set for specific event reporting and advanced container configurations.
          properties:
            events:
              type: object
              description: Container events that can be configured to report to a webhook.
              properties:
                deploy:
                  type: string
                  description: A webhook to hit when a container deploy event happens.
                start:
                  type: string
                  description: A webhook to hit when a container start event happens.
                stop:
                  type: string
                  description: A webhook to hit when a container stop event happens.
            config:
              type: string
              description: An endpoint that the platform will react out to with a get request.  This endpoint serves a partial container config which can modify `runtime`, `resources`, and `integrations` configurations.
        files:
          type: array
          description: Inject remotely hosted files into container instances at runtime.
          items:
            type: object
            description: These objects are sources and destinations for the given files.
            required:
              - source
              - destination
            properties:
              source:
                type: string
                description: The http endpoint that is hosting the files to be used.
              destination:
                type: string
                description: The path in the container for these files to be injected.
        lets_encrypt:
          description: Configuration settings to embed a TLS certificate in the container.
          oneOf:
            - type: object
              properties:
                certificate_path:
                  type: string
                  description: Path where the `certificate.cert` will be saved.
                chain_path:
                  type: string
                  description: Path where the `certificate.chain` will be saved.
                key_path:
                  type: string
                  description: Path where the `certificate.key` will be saved.
                bundle_path:
                  type: string
                  description: Path where the `certificate.bundle` will be saved.
                additional_certs_path:
                  type: string
                  description: File path where any remaining certificate files will be stored.
            - type: 'null'
        backups:
          type: object
          description: Automated backups configuration for the given container.
          required:
            - destination
            - backup
            - restore
            - retention
          properties:
            integration_id:
              $ref: '#/components/schemas/HybridIdentifier'
            backup:
              type: object
              description: Configuration settings for each backup.
              required:
                - command
              properties:
                command:
                  type: string
                  description: The command to run for the backup.
                timeout:
                  anyOf:
                    - $ref: '#/components/schemas/Duration'
                    - type: 'null'
                  description: How long the backup will attempt to run before timing out.
                cron_string:
                  $ref: '#/components/schemas/Crontab'
                  description: A cron string that configures how often the backup will run.
            restore:
              type:
                - object
                - 'null'
              description: Configuration settings for restoring from a backup.
              required:
                - command
              properties:
                command:
                  type: string
                  description: The command to run for restoring from a backup.
                timeout:
                  type: string
                  description: The time in seconds for the restore to attempt to complete before timing out.
                  allOf:
                    - $ref: '#/components/schemas/Duration'
            retention:
              anyOf:
                - $ref: '#/components/schemas/Duration'
                - type: 'null'
              description: How long the platform will keep backups. Default is 1 year.
              default: 365d
        shared_file_systems:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                required:
                  - writable
                  - mount_point
                properties:
                  writable:
                    type: boolean
                  mount_point:
                    type: string
            - type: 'null'
    Config:
      title: ContainerConfig
      description: A container configuration.
      type: object
      required:
        - network
        - deploy
      properties:
        network:
          $ref: '#/components/schemas/ContainerNetwork'
        deploy:
          $ref: '#/components/schemas/ContainerDeploy'
        scale:
          $ref: '#/components/schemas/ContainerScale'
        runtime:
          $ref: '#/components/schemas/ContainerRuntime'
        resources:
          $ref: '#/components/schemas/ContainerResources'
        integrations:
          $ref: '#/components/schemas/ContainerIntegrations'
    Deployment:
      title: Deployment
      description: |
        A logical grouping of containers inside of an Environment. Facilitates zero-downtime deployments by separating multiple versions of the same application within an environment.

        If a container is a member of a deployment, it can only resolve containers in that same deployment, or containers NOT in a deployment. If a container is NOT a member of a deployment, it can resolve all containers in the environment.
      type: object
      required:
        - version
      properties:
        version:
          $ref: '#/components/schemas/Version'
          description: |
            A version string representing the deployment.
    DataSize:
      title: DataSize
      type: string
      description: |
        A human-readable data size string. Values are expressed as an integer followed by a unit suffix, without spaces. Supported units:
          - b, k, m, g, t, p (bytes, kilobytes, megabytes, gigabytes, terabytes, petabytes)
          - An optional "b" suffix may be added (e.g., "mb", "gb").
        Units are case-insensitive. Example: "512M", "10GB", "1t".
      pattern: ^[0-9]+([bBkKmMgGtTpP]|[kKmMgGtTpP][bB])$
      examples:
        - 512M
        - 10GB
        - 1t
    ContainerVolume:
      title: ContainerVolume
      type: object
      description: Configuration settings for container volumes.
      required:
        - read_only
        - block_device
        - destination
      properties:
        identifier:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        read_only:
          type: boolean
          description: A boolean where true marks the volume as read only.
        block_device:
          type: boolean
          description: |
            Indicates that the volume will be used as unformatted block storage.
        local:
          oneOf:
            - type: object
              description: Configuration for settings local to the container filesystem.
              required:
                - max_size
              properties:
                max_size:
                  $ref: '#/components/schemas/DataSize'
                  description: The maximum size this volume can grow to. Container volumes on Cycle are thinly provisioned, meaning this isn't an allocation - the volume will only use the space it needs up to this size.
                stateless:
                  type:
                    - boolean
                    - 'null'
                  default: false
                  description: |
                    If set to true, this volume will be treated as ephemeral. Stateless volumes will **NOT** be migrated.
                    Stateless volumes on stateful containers will be wiped on container stop.
                storage_pool:
                  oneOf:
                    - type: boolean
                      description: A boolean where true signifies using the largest drive over 2TB for the target server.
                    - type: 'null'
            - type: 'null'
        external:
          anyOf:
            - type: object
              properties:
                id:
                  oneOf:
                    - $ref: '#/components/schemas/ID'
                    - type: 'null'
                  description: The id of the external volume.
            - type: 'null'
        destination:
          type: string
          description: The mountpoint path for the container.
        remote_access:
          type: object
          description: Configuration settings for remotely accessing the container volume.
          required:
            - enable
            - password
          properties:
            enable:
              type: boolean
              description: A boolean where true represents this container volume being open to remote access connections over SFTP.
            ips:
              type: array
              items:
                type: string
            webhook:
              type: string
              description: Call out to a webhook to authenticate usernames/passwords if an organization manages their own accounts
            password:
              type:
                - object
                - 'null'
              description: Password configuration settings for the remote access of the container volume.
              required:
                - algorithm
                - data
              properties:
                algorithm:
                  type: string
                  description: The hashing algorithm used to has the password.
                  enum:
                    - raw
                    - sha512
                    - md5
                data:
                  type: string
                  description: The raw or hashed password.
    VolumeSummary:
      title: VolumeSummary
      type: object
      description: A summary of relevant volume information.
      required:
        - id
        - hash
        - config
      properties:
        id:
          $ref: '#/components/schemas/ID'
        hash:
          type: string
          description: A unique hash for the given volume.
        config:
          $ref: '#/components/schemas/ContainerVolume'
        external:
          description: The ID of external volume, if applicable.
          oneOf:
            - type: object
              properties:
                id:
                  $ref: '#/components/schemas/ID'
            - type: 'null'
        removed:
          description: The timestamp of the volume's removal, if applicable.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    ContainerHighAvailabilityPrimary:
      title: ContainerHighAvailabilityPrimary
      description: |
        Details about the instance currently elected as the high availability primary for a container.
      type: object
      required:
        - instance_id
        - priority
        - elected
        - last_checkin
      properties:
        instance_id:
          description: The ID of the instance that has been elected as the primary.
          $ref: '#/components/schemas/ID'
        priority:
          type: integer
          format: int32
          description: The priority value assigned to this instance for the election. Higher priority means more likely to be elected primary.
        elected:
          description: The time at which this instance was elected as the primary.
          $ref: '#/components/schemas/DateTime'
        last_checkin:
          description: The time the primary instance last checked into the high availability service.
          $ref: '#/components/schemas/DateTime'
    ContainerHighAvailability:
      title: ContainerHighAvailability
      description: |
        The high availability configuration and status for a container, as determined by the platform.
      type: object
      required:
        - last_checkin
        - primary
      properties:
        last_checkin:
          description: The last time the primary checked in.
          $ref: '#/components/schemas/DateTime'
        primary:
          description: |
            Information about the instance currently elected as the primary for this container. Null when no primary has been elected.
          oneOf:
            - $ref: '#/components/schemas/ContainerHighAvailabilityPrimary'
            - type: 'null'
    DnsRecordA:
      title: DnsRecordA
      type: object
      description: A DNS A record.
      required:
        - ip
      properties:
        ip:
          type: string
          description: The IPv4 address that the A record should map to.
    DnsRecordAaaa:
      title: DnsRecordAaaa
      type: object
      description: A DNS AAAA record.
      required:
        - ip
      properties:
        ip:
          type: string
          description: The IPv6 address that the AAAA record should map to.
    DnsRecordCname:
      title: DnsRecordCname
      type: object
      description: A DNS CNAME record.
      required:
        - domain
      properties:
        domain:
          type: string
          description: The domain string the record resolves to.
    DnsRecordNs:
      title: DnsRecordNs
      type: object
      description: A DNS NS record.
      required:
        - domain
      properties:
        domain:
          type: string
          description: The domain of the nameserver for this record.
    DnsRecordMx:
      title: DnsRecordMx
      type: object
      description: A DNS MX record.
      required:
        - priority
        - domain
      properties:
        priority:
          type: integer
          description: The priority setting for this mx record.
        domain:
          type: string
          description: The domain this mx record points to.
    DnsRecordTxt:
      title: DnsRecordTxt
      type: object
      description: A DNS TXT record.
      required:
        - value
      properties:
        value:
          type: string
          description: The value for this TXT record.
    DnsRecordAlias:
      title: DnsRecordAlias
      type: object
      description: A DNS ALIAS record.
      required:
        - domain
      properties:
        domain:
          type: string
          description: The domain string returned from the DNS server when this alias record is requested.
    DnsRecordSrv:
      title: DnsRecordSrv
      type: object
      description: A DNS SRV record.
      required:
        - weight
        - priority
        - port
        - domain
      properties:
        weight:
          type: integer
          description: The weight configured for this record - breaks ties for priority.
        priority:
          type: integer
          description: The priority for the record.
        port:
          type: integer
          description: The port number for the service.
        domain:
          type: string
          description: The domain for the record.
    DnsRecordCaa:
      title: DnsRecordCaa
      type: object
      description: A DNS CAA record.
      required:
        - tag
        - value
      properties:
        tag:
          type: string
          description: The ASCII string that represents the identifier of the property represented by the record.
        value:
          type: string
          description: The value associated with the tag.
    DnsRecordLinkedHttpRouting:
      title: DnsRecordLinkedHttpRouting
      type: object
      required:
        - match_path
      properties:
        match_path:
          type:
            - string
            - 'null'
          description: |
            If set, this record will configure the load balancer to only match for paths of this domain matching this string.
            If the string starts with a /, it will be a literal prefix match (/test matches /test*). Otherwise, regex is used.
    DnsRecordLinkedVirtualMachine:
      title: DnsRecordLinkedVirtualMachine
      type: object
      required:
        - virtual_machine
      properties:
        virtual_machine:
          type: object
          required:
            - id
            - dmz
          properties:
            id:
              $ref: '#/components/schemas/ID'
            dmz:
              type: boolean
              description: |
                If true, traffic to this domain will skip the load balancer and go directly to the virtual machine
                via the gateway service.
    DnsRecordLinkedDeployment:
      title: DnsRecordLinkedDeployment
      type: object
      properties:
        deployment:
          type: object
          description: Information about the deployment this record points to.
          required:
            - environment_id
            - match
          properties:
            environment_id:
              $ref: '#/components/schemas/ID'
              description: The ID of the environment with the deployment tag mapping we want to reference.
            match:
              type: object
              description: Describes which container and which tagged deployment this record should target.
              required:
                - container
              properties:
                container:
                  $ref: '#/components/schemas/Identifier'
                  description: The identifier of the container in the environment this record should point to.
                tag:
                  description: The deployment tag that this record should point to. The tags are set on the root of an environment and map to a deployment version.
                  anyOf:
                    - $ref: '#/components/schemas/Identifier'
                    - type: 'null'
    DnsRecordLinkedVariantDestination:
      title: DnsRecordLinkedVariantDestination
      description: The destination a variant routes traffic to.
      oneOf:
        - type: object
          properties:
            container_id:
              type: string
              description: The ID of the container this record is related to.
        - $ref: '#/components/schemas/DnsRecordLinkedVirtualMachine'
        - $ref: '#/components/schemas/DnsRecordLinkedDeployment'
    DnsRecordLinkedVariant:
      title: DnsRecordLinkedVariant
      type: object
      description: A weighted routing variant. Traffic is distributed across variants according to their weights.
      required:
        - destination
        - weight
      properties:
        destination:
          $ref: '#/components/schemas/DnsRecordLinkedVariantDestination'
        weight:
          type: integer
          minimum: 0
          maximum: 1000
          description: The weight of this variant relative to the other variants, used to distribute traffic across destinations. Valid range is 0 to 1000.
    DnsRecordLinkedRouting:
      title: DnsRecordLinkedRouting
      type: object
      description: Rules for routing traffic at the load balancer for this linked record.
      properties:
        http:
          oneOf:
            - $ref: '#/components/schemas/DnsRecordLinkedHttpRouting'
            - type: 'null'
        variants:
          type:
            - array
            - 'null'
          description: A set of weighted destinations that traffic to this record is distributed across.
          items:
            $ref: '#/components/schemas/DnsRecordLinkedVariant'
    DnsRecordLinked:
      title: DnsRecordLINKED
      type: object
      description: A LINKED record is a record special to Cycle. It represents a URL that points to a specific container or deployment of a container, however the IP address mapping is handled automatically by the platform.
      allOf:
        - type: object
          required:
            - features
            - routing
          properties:
            routing:
              $ref: '#/components/schemas/DnsRecordLinkedRouting'
            features:
              type: object
              description: Features associated with this record.
              required:
                - tls
                - geodns
              properties:
                tls:
                  type: object
                  description: TLS properties of the record.
                  required:
                    - enable
                  properties:
                    enable:
                      type: boolean
                      description: A boolean, where true represents this record will be paired with a TLS certificate automatically maintained by the platform.
                geodns:
                  type: object
                  description: Options for the GeoDNS LINKED record feature.
                  required:
                    - enable
                  properties:
                    enable:
                      type: boolean
                      description: If enabled, Cycle will attempt to match inbound requests to the closest load balancer geographically.
                wildcard:
                  type:
                    - object
                    - 'null'
                  required:
                    - resolve_sub_domains
                  properties:
                    resolve_sub_domains:
                      description: If enabled, subdomains will resolve for wildcard records. If disabled, only the primary domain will resolve.
                      default: false
                      type: boolean
        - oneOf:
            - type: object
              properties:
                container_id:
                  type: string
                  description: The ID of the container this record is related to.
            - $ref: '#/components/schemas/DnsRecordLinkedVirtualMachine'
            - $ref: '#/components/schemas/DnsRecordLinkedDeployment'
    DnsRecordTypes:
      title: DnsRecordTypes
      type: object
      description: DNS record types the platform supports.
      properties:
        a:
          $ref: '#/components/schemas/DnsRecordA'
        aaaa:
          $ref: '#/components/schemas/DnsRecordAaaa'
        cname:
          $ref: '#/components/schemas/DnsRecordCname'
        ns:
          $ref: '#/components/schemas/DnsRecordNs'
        mx:
          $ref: '#/components/schemas/DnsRecordMx'
        txt:
          $ref: '#/components/schemas/DnsRecordTxt'
        alias:
          $ref: '#/components/schemas/DnsRecordAlias'
        srv:
          $ref: '#/components/schemas/DnsRecordSrv'
        caa:
          $ref: '#/components/schemas/DnsRecordCaa'
        linked:
          $ref: '#/components/schemas/DnsRecordLinked'
    DnsRecordTlsCertificate:
      title: DnsRecordTlsCertificate
      type: object
      description: A TLS certificate assigned to a DNS record.
      required:
        - id
        - generated
        - wildcard_child
        - user_supplied
      properties:
        id:
          $ref: '#/components/schemas/ID'
        generated:
          $ref: '#/components/schemas/DateTime'
        wildcard_child:
          type: boolean
          description: A value where true represents that the certificate is using a shared wildcard cert.
        user_supplied:
          type: boolean
          description: If true, this certificate was manually supplied, and was not auto-generated by the platform.
        expires:
          $ref: '#/components/schemas/DateTime'
          description: The time that this certificate expires.
    DnsRecordState:
      title: DnsRecordState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the record.
              type: string
              enum:
                - pending
                - live
                - deleting
                - deleted
        - $ref: '#/components/schemas/State'
    Events:
      title: Events
      description: Describes the date and time at which certain events occurred in the lifetime of this resource.
      type: object
      additionalProperties:
        $ref: '#/components/schemas/DateTime'
    DnsRecord:
      title: DnsRecord
      type: object
      description: A DNS record.
      required:
        - id
        - hub_id
        - creator
        - zone_id
        - name
        - resolved_domain
        - type
        - features
        - state
        - events
      properties:
        id:
          $ref: '#/components/schemas/ID'
        hub_id:
          $ref: '#/components/schemas/HubID'
        creator:
          $ref: '#/components/schemas/CreatorScope'
        zone_id:
          type: string
          description: A unique identifier for the zone
        name:
          type: string
          description: A name used for the record, where `@` signifies the use of the root domain.
        resolved_domain:
          type: string
          description: The name of the record and the origin as a domain name.
        type:
          $ref: '#/components/schemas/DnsRecordTypes'
        features:
          description: TLS features for the record.
          oneOf:
            - type: object
              required:
                - certificate
              properties:
                certificate:
                  anyOf:
                    - $ref: '#/components/schemas/DnsRecordTlsCertificate'
                    - type: 'null'
            - type: 'null'
        state:
          $ref: '#/components/schemas/DnsRecordState'
        events:
          $ref: '#/components/schemas/Events'
    IpOptions:
      title: IpOptions
      type: object
      description: Options for an IP.
      properties:
        proxy_arp:
          description: If enabled, allows pool to respond to ARP requests, on behalf of a container / virtual machine, at the host level.
          oneOf:
            - type: boolean
            - type: 'null'
    IpState:
      title: IpState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the IP.
              type: string
              enum:
                - assigning
                - assigned
                - releasing
                - available
        - $ref: '#/components/schemas/State'
    Ip:
      title: IP
      type: object
      description: Details about an IP.
      required:
        - id
        - hub_id
        - kind
        - ip
        - assignment
        - pool_id
        - network_id
        - address
        - gateway
        - cidr
        - state
      properties:
        id:
          $ref: '#/components/schemas/ID'
        hub_id:
          $ref: '#/components/schemas/HubID'
        kind:
          type: string
          description: The type of IP protocol this IP is.
          enum:
            - ipv4
            - ipv6
        ip:
          description: The IP string this IP represents.
          $ref: '#/components/schemas/IpAddress'
        assignment:
          description: Information about the assignment of this IP.
          oneOf:
            - type: object
              required:
                - container_id
                - instance_id
                - environment_id
              properties:
                container_id:
                  $ref: '#/components/schemas/ID'
                instance_id:
                  $ref: '#/components/schemas/ID'
                environment_id:
                  $ref: '#/components/schemas/ID'
                virtual_machine:
                  type: object
                  description: Details about the virtual machine this IP is assigned to.
                  properties:
                    id:
                      $ref: '#/components/schemas/ID'
                  required:
                    - id
            - type: 'null'
        pool_id:
          $ref: '#/components/schemas/ID'
          description: A unique identifier that associates the IP with an IP pool.
        network_id:
          $ref: '#/components/schemas/ID'
          description: A unique identifier that associates the IP with a network.
        address:
          type: string
          description: The IP address.
        gateway:
          type: string
          description: The IP gateway.
        network:
          oneOf:
            - $ref: '#/components/schemas/Cidr'
            - type: 'null'
        options:
          oneOf:
            - $ref: '#/components/schemas/IpOptions'
            - type: 'null'
        cidr:
          type: string
          description: The CIDR for the IP.
        state:
          $ref: '#/components/schemas/IpState'
    ContainersMeta:
      title: ContainersMeta
      type: object
      description: A list of meta fields that can be applied to a container.
      properties:
        instances_count:
          $ref: '#/components/schemas/StateCountSummary'
        domains:
          type:
            - array
            - 'null'
          items:
            type: object
            description: Any associated Linked Records for this container, and their fully-qualified domain name (fqdn).
            required:
              - fqdn
            properties:
              fqdn:
                type: string
                description: The fully qualified domain name.
              record:
                $ref: '#/components/schemas/DnsRecord'
        ips:
          description: An array of IP resources.
          type: array
          items:
            $ref: '#/components/schemas/Ip'
    Container:
      title: Container
      type: object
      description: Containers are a way to package together your application along with it's dependencies, and run in a resource isolated process. They provide consistency across different hosts, efficiency over traditional hosting methods, and facilitate a micro-service based approach, where each logical piece of your application is split into multiple, easily testable parts (such as API, Backend, Frontend, etc).
      required:
        - id
        - name
        - identifier
        - creator
        - environment
        - hub_id
        - image
        - config
        - instances
        - stateful
        - state
        - role
        - ha
        - deployment
        - deprecate
        - lock
        - events
      properties:
        id:
          $ref: '#/components/schemas/ID'
        identifier:
          $ref: '#/components/schemas/Identifier'
          description: A human readable slugged identifier for this container. Usually used as a key in a stack file.
        name:
          type: string
          description: A user defined name for the container resource.
        creator:
          $ref: '#/components/schemas/CreatorScope'
        environment:
          $ref: '#/components/schemas/ContainerEnvironmentSummary'
        hub_id:
          $ref: '#/components/schemas/HubID'
        image:
          $ref: '#/components/schemas/ImageSummary'
        stack:
          anyOf:
            - $ref: '#/components/schemas/StackSummary'
            - type: 'null'
        config:
          $ref: '#/components/schemas/Config'
        deployment:
          anyOf:
            - $ref: '#/components/schemas/Deployment'
            - type: 'null'
        instances:
          type: integer
          description: The number of instances for a given container.
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/VolumeSummary'
        annotations:
          description: Custom meta data for a given container
          oneOf:
            - type: object
              additionalProperties: {}
            - type: 'null'
        role:
          description: The role of a given container if it has one.
          oneOf:
            - type: string
              enum:
                - orchestrator
            - type: 'null'
        ha_elections:
          description: High availability election status of the container. Contains information about the primary instance, if any.
          oneOf:
            - $ref: '#/components/schemas/ContainerHighAvailability'
            - type: 'null'
        stateful:
          type: boolean
          description: A boolean where true signifies the container is stateful.
        deprecate:
          type: boolean
          description: A boolean where true signifies the container is marked as deprecated.
        lock:
          type: boolean
          description: When set to true, prevents this container from being deleted.
        state:
          $ref: '#/components/schemas/ContainerState'
        events:
          title: ContainerEvents
          type: object
          description: A collection of timestamps for each event in the container's lifetime.
          required:
            - created
            - updated
            - deleted
            - started
          properties:
            created:
              description: The timestamp of when the container was created.
              $ref: '#/components/schemas/DateTime'
            updated:
              description: The timestamp of when the container was updated.
              $ref: '#/components/schemas/DateTime'
            deleted:
              description: The timestamp of when the container was deleted.
              $ref: '#/components/schemas/DateTime'
            started:
              description: The timestamp of when the container was started.
              $ref: '#/components/schemas/DateTime'
        meta:
          $ref: '#/components/schemas/ContainersMeta'
    EnvironmentNetworkSummary:
      title: EnvironmentNetworkSummary
      type: object
      description: Details about the environment network this instance is a member of.
      required:
        - id
        - network_subnet
        - subnet
        - ipv6
        - legacy
        - mac_addr
        - vxlan_tag
      properties:
        id:
          $ref: '#/components/schemas/ID'
        network_subnet:
          type: string
        subnet:
          type: string
        ipv6:
          anyOf:
            - $ref: '#/components/schemas/IPNet'
            - type: 'null'
        legacy:
          oneOf:
            - type: object
              required:
                - host
                - subnet
                - ipv4
              properties:
                host:
                  type: integer
                subnet:
                  type: integer
                ipv4:
                  anyOf:
                    - $ref: '#/components/schemas/IPNet'
                    - type: 'null'
            - type: 'null'
        mac_addr:
          type: string
        vxlan_tag:
          type: integer
    InstanceProvider:
      title: InstanceProvider
      type: object
      required:
        - vendor
        - integration_id
        - location
      properties:
        vendor:
          type: string
          description: The vendor of the hub provider integration related to the server this instance runs on.
        integration_id:
          $ref: '#/components/schemas/ID'
          description: An ID of the provider Hub integration that this instance's host node is related to.
        location:
          type: string
          description: The identifier of the location related to the server this instance runs on.
    InstanceState:
      title: InstanceState
      description: Information about the state of an instance.
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the instance.
              type: string
              enum:
                - new
                - starting
                - migrating
                - running
                - stopping
                - stopped
                - failed
                - deleting
                - deleted
            health:
              description: information about the health of the instance.
              oneOf:
                - type: object
                  required:
                    - healthy
                    - updated
                  properties:
                    healthy:
                      description: |
                        Describes the healthiness of the instance. Health checks can be configured at the container level. 
                        - `true`: The instance is considered healthy.
                        - `false`: The instance is considered unhealthy.
                        - `null`: The instance has not yet reported its health, or a health check has not yet been performed.
                      oneOf:
                        - type: boolean
                        - type: 'null'
                    updated:
                      description: A timestamp of the last time the instance health was updated.
                      $ref: '#/components/schemas/DateTime'
                - type: 'null'
            readiness:
              description: information about the readiness of the instance.
              oneOf:
                - type: object
                  required:
                    - ready
                    - updated
                  properties:
                    ready:
                      description: |
                        Describes the readiness of the instance.
                        - `true`: The instance is ready.
                        - `false`: The instance is not ready.
                        - `null`: The instance has not yet reported its readiness, or a readiness check has not yet been performed.
                      oneOf:
                        - type: boolean
                        - type: 'null'
                    updated:
                      description: A timestamp of the last time the instance readiness was updated.
                      $ref: '#/components/schemas/DateTime'
                - type: 'null'
        - $ref: '#/components/schemas/State'
    InstanceAutoScale:
      title: InstanceAutoScale
      description: Auto-scale details for instances created by auto-scale events.
      type: object
      required:
        - min_ttl
      properties:
        min_ttl:
          $ref: '#/components/schemas/DateTime'
    InstanceTrafficDrain:
      title: InstanceTrafficDrain
      description: Traffic drain details for instance.
      type: object
      required:
        - started
      properties:
        started:
          $ref: '#/components/schemas/DateTime'
    MigrationInstance:
      title: MigrationInstance
      type: object
      description: Information about a migrated instance.
      required:
        - instance_id
        - server_id
      properties:
        instance_id:
          type: string
          description: The ID of the instance.
        server_id:
          type: string
          description: The ID of the server.
    InstanceMigration:
      title: InstanceMigration
      type: object
      description: Information regarding the migration of an instance, such as the server that the instance came from or the server that the instance was moved to.
      required:
        - key
        - copy_volumes
      properties:
        to:
          anyOf:
            - $ref: '#/components/schemas/MigrationInstance'
            - type: 'null'
        from:
          anyOf:
            - $ref: '#/components/schemas/MigrationInstance'
            - type: 'null'
        started:
          description: A timestamp of when the migration was started.
          $ref: '#/components/schemas/DateTime'
        completed:
          description: A timestamp of when the migration was completed.
          $ref: '#/components/schemas/DateTime'
        key:
          type: string
          description: A key used by the platform to verify the migration.
        copy_volumes:
          type: boolean
          description: A boolean where true represents the volumes for the instance should be copied to the new server as well.
    InstanceHighAvailability:
      title: InstanceHighAvailability
      description: |
        The high availability status of the instance, as determined by the platform. 

        This data becomes avaialble when utilizing the internal API high availability endpoint. The platform will hold elections for all instances hitting the endpoint and choose a primary. As long as those instances continue to check in, the primary will continue to be the primary until it is dropped off. After which, a secondary will be promoted.
      type: object
      required:
        - last_checkin
      properties:
        elected_primary:
          description: If a time is set, indicates that this instance is the primary, and the time at which it was promoted.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        last_checkin:
          description: The time that the instance last checked into the HA service.
          $ref: '#/components/schemas/DateTime'
    NodeState:
      title: NodeState
      allOf:
        - required:
            - current
            - changed
          properties:
            current:
              description: The current state of the node.
              type: string
              enum:
                - new
                - offline
                - authorizing
                - online
                - decommissioned
                - deleted
            changed:
              $ref: '#/components/schemas/DateTime'
            desired:
              oneOf:
                - type: string
                  enum:
                    - new
                    - offline
                    - authorizing
                    - online
                    - decommissioned
                    - deleted
                - type: 'null'
        - $ref: '#/components/schemas/State'
    InstanceMeta:
      title: InstanceMeta
      type: object
      description: A list of meta fields that can be applied to an instance.
      properties:
        node:
          type: object
          properties:
            healthy:
              type: boolean
            online:
              type: boolean
            last_checkin:
              $ref: '#/components/schemas/DateTime'
            state:
              $ref: '#/components/schemas/NodeState'
        sdn_pool_ips:
          type: array
          items:
            $ref: '#/components/schemas/Ip'
    Instance:
      title: Instance
