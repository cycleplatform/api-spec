            - type: 'null'
        traffic_drain:
          anyOf:
            - $ref: '#/components/schemas/InstanceTrafficDrain'
            - type: 'null'
        migration:
          anyOf:
            - $ref: '#/components/schemas/InstanceMigration'
            - type: 'null'
        deployment:
          anyOf:
            - $ref: '#/components/schemas/Deployment'
            - type: 'null'
        ha_elections:
          oneOf:
            - $ref: '#/components/schemas/InstanceHighAvailability'
            - type: 'null'
        events:
