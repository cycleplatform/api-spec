            - type: 'null'
        provider:
          $ref: '#/components/schemas/InstanceProvider'
        server_id:
          $ref: '#/components/schemas/ID'
          description: An identifier for the server this instance is deployed to.
        ready_state:
          type: string
          description: |
            The state as it relates to the following:
              - `active` - instance can be started or stopped.
              - `purge` - instance should be deleted.
              - `hibernate` - instance is active but not allowed to run.
              - `configuring` - this instance is not allowed to start yet
          enum:
            - active
            - purge
            - hibernate
            - configuring
        deployment:
          anyOf:
            - $ref: '#/components/schemas/Deployment'
            - type: 'null'
        hostname:
          type: string
          description: The hostname of the instance.
        service:
          $ref: '#/components/schemas/ServiceContainerIdentifier'
          description: The type of service this instance is within the environment, if any.
        state:
          $ref: '#/components/schemas/InstanceState'
    ServiceContainer:
      title: ServiceContainer
      description: Details about a service container and its instances.
      type: object
      required:
        - container
      properties:
        container:
          $ref: '#/components/schemas/ContainerSummary'
        instances:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/InstanceSummary'
    VirtualMachineNetworkConfig:
      title: VirtualMachineNetworkConfig
      type: object
      description: |
        Defines the network settings for a virtual machine, including public access mode, hostname, and ports.
      required:
        - public
        - hostname
        - egress_via_gateway
      properties:
        public:
          type: string
          enum:
            - enable
            - disable
            - egress-only
            - environment-limited
          description: Controls the public network mode for the virtual machine.
        hostname:
          type: string
          description: The hostname assigned to the virtual machine.
        ports:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: Port configurations for the virtual machine.
        egress_via_gateway:
          description: True indicates that traffic should leave via the gateway, not the underlying host.
          type: boolean
    VirtualMachineDeployTags:
      title: VirtualMachineDeployTags
      type: object
      description: |
        Tags that define node requirements for the deployment. The `any` tag must match at least one condition, while `all` must match all conditions.
      properties:
        any:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        all:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
    VirtualMachineNodeConstraints:
      title: VirtualMachineNodeConstraints
      type: object
      description: |
        Node-level constraints for the virtual machine deployment, specifying tags that must or must not be present.
      properties:
        tags:
          $ref: '#/components/schemas/VirtualMachineDeployTags'
      required:
        - tags
    VirtualMachineDeployConstraints:
      title: VirtualMachineDeployConstraints
      type: object
      description: |
        Constraints define node-level and resource restrictions for the virtual machine deployment.
      properties:
        node:
          anyOf:
            - $ref: '#/components/schemas/VirtualMachineNodeConstraints'
            - type: 'null'
        secrets:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        containers:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
    VirtualMachineShutdownPolicy:
      title: VirtualMachineShutdownPolicy
      type: object
      description: |
        The shutdown policy defines how the virtual machine should handle shutdown, including a timeout and signals to be sent during shutdown.
      properties:
        graceful_timeout:
          anyOf:
            - $ref: '#/components/schemas/Duration'
            - type: 'null'
          description: The timeout period for graceful shutdown.
    VirtualMachineStartupPolicy:
      title: VirtualMachineStartupPolicy
      type: object
      description: |
        The startup policy defines how the virtual machine should handle startup, including a possible delay before starting the machine.
      properties:
        delay:
          anyOf:
            - $ref: '#/components/schemas/Duration'
            - type: 'null'
          description: Delay before startup.
    VirtualMachineTelemetryConfig:
      title: VirtualMachineTelemetryConfig
      type: object
      description: |
        The telemetry configuration defines how telemetry data is handled, including retention, interval, and whether telemetry is disabled.
      properties:
        retention:
          anyOf:
            - $ref: '#/components/schemas/Duration'
            - type: 'null'
          description: Data retention duration for telemetry.
        interval:
          anyOf:
            - $ref: '#/components/schemas/Duration'
            - type: 'null'
          description: Telemetry collection interval.
        disable:
          type: boolean
          description: Whether telemetry collection is disabled.
      required:
        - disable
    VirtualMachineDeployConfig:
      title: VirtualMachineDeployConfig
      type: object
      description: |
        Represents the deployment configuration for a virtual machine, including constraints, shutdown/startup policies, restart conditions, and telemetry settings.
      properties:
        constraints:
          anyOf:
            - $ref: '#/components/schemas/VirtualMachineDeployConstraints'
            - type: 'null'
        shutdown:
          anyOf:
            - $ref: '#/components/schemas/VirtualMachineShutdownPolicy'
            - type: 'null'
        startup:
          anyOf:
            - $ref: '#/components/schemas/VirtualMachineStartupPolicy'
            - type: 'null'
        telemetry:
          anyOf:
            - $ref: '#/components/schemas/VirtualMachineTelemetryConfig'
            - type: 'null'
    VirtualMachineRamResources:
      title: VirtualMachineRamResources
      type: object
      description: |
        Defines the RAM configuration of a virtual machine.
      properties:
        limit:
          type: string
          description: The limit (maximum) amount of RAM the virtual machine can consume. Must be at least 512M and less than 65GB.
          examples:
            - 1G
            - 512M
        allocate:
          type:
            - boolean
            - 'null'
          description: Whether or not the RAM set in limit should be preallocated.
      required:
        - limit
    VirtualMachineCpuResources:
      title: VirtualMachineCpuResources
      type: object
      description: |
        Defines the CPU configuration of a virtual machine. Set **either** `cores` or `cpus`.
      properties:
        cores:
          anyOf:
            - type: object
              properties:
                number:
                  type: integer
                  description: The number of cores to assign to this virtual machine. Must be between 1 and 32.
                  examples:
                    - 1
                    - 2
                allocate:
                  type:
                    - boolean
                    - 'null'
                  description: If true, reserves the cores so they cannot be used by any other virtual machine.
              required:
                - number
            - type: 'null'
        cpus:
          type:
            - string
            - 'null'
          description: The specific cores/range of cores to allocate to the virtual machine. An 'x' indicates the maximum core for a given machine.
          examples:
            - '1'
            - 1-3
            - 2-x
    VirtualMachineResourcesConfig:
      title: VirtualMachineResourcesConfig
      type: object
      description: |
        Defines the resource settings for a virtual machine, including CPU and RAM.
      properties:
        ram:
          $ref: '#/components/schemas/VirtualMachineRamResources'
        cpu:
          $ref: '#/components/schemas/VirtualMachineCpuResources'
      required:
        - ram
        - cpu
    VirtualMachineCpuConfigDefault:
      title: VirtualMachineCpuConfigDefault
      type: object
      description: Predefined CPU selection.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - host
            - qemu32
            - qemu64
            - kvm64
          description: Predefined CPU type.
        details:
          type: object
          description: An object with no properties.
          properties: {}
          additionalProperties: false
    VirtualMachineCpuConfigCustom:
      title: VirtualMachineCpuConfigCustom
      type: object
      description: Custom CPU selection with model and feature flags.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - custom
          description: Custom CPU definition.
        details:
          type: object
          required:
            - model
          properties:
            model:
              type: string
              description: CPU model string (for example "Skylake-Client").
            feature_flags:
              oneOf:
                - type: array
                  description: Additional CPU feature flags to enable. Will start with a "+" or "-" to include or exclude.
                  example:
                    - +avx
                    - '-vmz'
                  items:
                    type: string
                - type: 'null'
    VirtualMachineRuntimeConfigHardware:
      title: VirtualMachineRuntimeConfigHardware
      type: object
      description: |
        Hardware parameters applied for VM runtime.
      required:
        - cpu
      properties:
        machine_type:
          description: QEMU machine type to emulate.
          oneOf:
            - type: string
              enum:
                - pc
                - q35
                - microvm
            - type: 'null'
        cpu:
          description: CPU configuration for the VM. Discriminated by `type`.
          oneOf:
            - $ref: '#/components/schemas/VirtualMachineCpuConfigDefault'
            - $ref: '#/components/schemas/VirtualMachineCpuConfigCustom'
          discriminator:
            propertyName: type
            mapping:
              host: '#/components/schemas/VirtualMachineCpuConfigDefault'
              qemu32: '#/components/schemas/VirtualMachineCpuConfigDefault'
              qemu64: '#/components/schemas/VirtualMachineCpuConfigDefault'
              kvm64: '#/components/schemas/VirtualMachineCpuConfigDefault'
              custom: '#/components/schemas/VirtualMachineCpuConfigCustom'
      additionalProperties: false
    VirtualMachineAttachmentTypeIso:
      title: VirtualMachineAttachmentTypeIso
      type: object
      description: Details of an ISO attachment for a virtual machine.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - iso
          description: The type of the attachment (iso)
        details:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              description: The URL of the ISO to download and attach to this virtual machine.
    VirtualMachineRuntimeConfigAttachment:
      title: VirtualMachineRuntimeConfigAttachment
      description: |
        Additional attachment (ISO, etc) added during runtime.
      oneOf:
        - $ref: '#/components/schemas/VirtualMachineAttachmentTypeIso'
      discriminator:
        propertyName: type
        mapping:
          iso: '#/components/schemas/VirtualMachineAttachmentTypeIso'
    VirtualMachineRuntimeConfig:
      title: VirtualMachineRuntimeConfig
      type: object
      description: |
        Defines the runtime settings for a virtual machine.
      properties:
        hardware:
          description: Hardware parameters applied for VM runtime.
          oneOf:
            - $ref: '#/components/schemas/VirtualMachineRuntimeConfigHardware'
            - type: 'null'
        attach:
          description: An array of attachments to 'plug in' to the virtual machine.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/VirtualMachineRuntimeConfigAttachment'
            - type: 'null'
        os_flavor:
          description: The type of operating system that will be installed to the virtual machine. Allows for preconfigured settings, such as virtio-win drivers for Windows.
          oneOf:
            - type: string
              enum:
                - linux
                - unix
                - windows
      additionalProperties: false
    VirtualMachineConfig:
      title: VirtualMachineConfig
      type: object
      description: |
        Defines the network and deployment configurations for a virtual machine.
      properties:
        network:
          $ref: '#/components/schemas/VirtualMachineNetworkConfig'
        deploy:
          $ref: '#/components/schemas/VirtualMachineDeployConfig'
        resources:
          $ref: '#/components/schemas/VirtualMachineResourcesConfig'
        runtime:
          oneOf:
            - $ref: '#/components/schemas/VirtualMachineRuntimeConfig'
            - type: 'null'
      required:
        - network
        - deploy
        - resources
    VirtualMachineImageSourceUrl:
      title: VirtualMachineImageSourceUrl
      description: A virtual machine image sourced from a URL.
      type: object
      properties:
        type:
          type: string
          enum:
            - url
        details:
          type: object
          properties:
            url:
              type: string
              description: The URL where a custom image is located.
          required:
            - url
      required:
        - type
        - details
    VirtualMachineImageSourceIpxe:
      title: VirtualMachineImageSourceIpxe
      description: A virtual machine image sourced from an IPXE script.
      type: object
      properties:
        type:
          type: string
          enum:
            - ipxe
        details:
          type: object
          properties:
            chain_url:
              type:
                - string
                - 'null'
              description: A URL that points to an IPXE script.
            script:
              type:
                - string
                - 'null'
              description: An inline IPXE script.
      required:
        - type
        - details
    VirtualMachineImageSourceBase:
      title: VirtualMachineImageSourceBase
      description: A virtual machine image sourced from a Cycle base image.
      type: object
      properties:
        type:
          type: string
          enum:
            - base
        details:
          type: object
          properties:
            identifier:
              type: string
              description: The base image identifier.
          required:
            - identifier
      required:
        - type
        - details
    VirtualMachineImageSourceExternalVolume:
      title: VirtualMachineImageSourceExternalVolume
      description: A virtual machine image sourced from a SAN target.
      type: object
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - external-volume
        details:
          type: object
          properties:
            identifier:
              description: The identifier of the external volume where the image is located.
              oneOf:
                - $ref: '#/components/schemas/Identifier'
                - type: 'null'
            id:
              description: The id of the external volume where the image is located.
              oneOf:
                - $ref: '#/components/schemas/ID'
                - type: 'null'
    VirtualMachineImage:
      title: VirtualMachineImage
      type: object
      description: |
        Represents the image used by a virtual machine. It can either reference a URL where the image is located or specify a base image provided by Cycle.
      discriminator:
        propertyName: type
        mapping:
          url: '#/components/schemas/VirtualMachineImageSourceUrl'
          ipxe: '#/components/schemas/VirtualMachineImageSourceIpxe'
          base: '#/components/schemas/VirtualMachineImageSourceBase'
          external-volume: '#/components/schemas/VirtualMachineImageSourceExternalVolume'
      oneOf:
        - $ref: '#/components/schemas/VirtualMachineImageSourceUrl'
        - $ref: '#/components/schemas/VirtualMachineImageSourceIpxe'
        - $ref: '#/components/schemas/VirtualMachineImageSourceBase'
        - $ref: '#/components/schemas/VirtualMachineImageSourceExternalVolume'
    VirtualMachineVolumeConfig:
      title: VirtualMachineVolumeConfig
      type: object
      description: |
        Represents the configuration for a volume attached to a virtual machine.
      required:
        - identifier
        - read_only
      properties:
        local:
          anyOf:
            - type: object
              required:
                - max_size
              properties:
                max_size:
                  type: string
                  description: The maximum size allowed for the local volume.
                  examples:
                    - 100G
                storage_pool:
                  anyOf:
                    - type: boolean
                    - type: 'null'
                  description: Indicates if the volume is part of a storage pool.
                stateless:
                  type:
                    - boolean
                    - 'null'
                  default: false
                  description: |
                    If set to true, this volume will be treated as ephemeral. Stateless volumes will **NOT** be migrated.
                    Base volumes cannot be stateless.
            - type: 'null'
          description: Configuration details for a local volume.
        external:
          anyOf:
            - type: object
              properties:
                id:
                  oneOf:
                    - $ref: '#/components/schemas/ID'
                    - type: 'null'
                  description: The id of the external volume.
            - type: 'null'
          description: Configuration details for a SAN volume.
        identifier:
          $ref: '#/components/schemas/Identifier'
        read_only:
          type: boolean
          description: Specifies if the volume is mounted as read-only.
    VirtualMachineVolume:
      title: VirtualMachineVolume
      type: object
      description: |
        Represents a storage volume attached to a virtual machine.
      properties:
        id:
          $ref: '#/components/schemas/ID'
        hash:
          type: string
          description: A unique hash identifying the volume for the virtual machine.
        config:
          $ref: '#/components/schemas/VirtualMachineVolumeConfig'
          description: The configuration details for the virtual machine's volume.
        removed:
          description: The timestamp of the volume's removal, if applicable.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
      required:
        - id
        - hash
        - config
    VirtualMachineState:
      title: VirtualMachineState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the virtual machine.
              type: string
              enum:
                - new
                - starting
                - configuring
                - running
                - stopping
                - stopped
                - deleting
                - deleted
        - $ref: '#/components/schemas/State'
    ServerSharedFileSystems:
      title: ServerSharedFileSystems
      type: object
      properties:
        mounts:
          oneOf:
            - type: object
              additionalProperties:
                type: object
                required:
                  - type
                  - options
                  - source
                properties:
                  type:
                    type: string
                    description: String describing the server mount type.
                  options:
                    type: string
                    description: Comma separated string describing the server mount options.
                    examples:
                      - key1=value1,key2=value2
                  source:
                    type: string
                    description: String describing the server mount source.
            - type: 'null'
        directories:
          description: An object describing directory identifiers with value {}.
          oneOf:
            - type: object
              additionalProperties: {}
            - type: 'null'
    ServerProvider:
      title: ServerProvider
      type: object
      description: A resource regarding the provider a given server is deployed from.
      required:
        - vendor
        - integration_id
        - model
        - location
        - server
      properties:
        vendor:
          type: string
          description: The vendor for the provider this server is deployed from.
        integration_id:
          $ref: '#/components/schemas/ID'
        model:
          type: string
          description: The model of the server that is deployed.
        zone:
          type:
            - string
            - 'null'
          description: The zone of the server that is deployed, if defined.
        location:
          type: string
          description: A location where the server is deployed.
        server:
          type: string
          description: A provider specific identifier for the server.
        init_ips:
          description: The IP's assigned to this server during provisioning.
          type: array
          items:
            type: string
        mac_addr:
          type: string
          description: The mac address for the server.
        extra:
          type: object
          additionalProperties: true
        provision_options:
          type: object
          properties:
            encrypt_storage:
              type: boolean
            storage_size:
              type: number
            reservation_id:
              type: string
    ServerFeatures:
      title: ServerFeatures
      type: object
      description: A set of features a given server can have and their information.
      required:
        - sftp
      properties:
        sftp:
          type: boolean
          description: A boolean where true means the server accepts incoming SFTP connections through the remote volume integration.
        base_volume_gb:
          type:
            - integer
            - 'null'
          description: The size of the base volume (where Cycle stores container images on this server).
        gateway:
          description: Configuration options for running gateway services on this server.
          oneOf:
            - type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: The type of gateway service that can be run on this server.
                  enum:
                    - bgp
                    - static
            - type: 'null'
    ServerConstraints:
      title: ServerConstraints
      type: object
      description: Constraints to apply to the server.
      required:
        - tags
        - allow
      properties:
        tags:
          description: A list of server tags to put on the given server.
          type: array
          items:
            type: string
        allow:
          type: object
          description: Settings for the server, things that are or are not allowed.
          required:
            - pool
            - services
            - overcommit
          properties:
            pool:
              type: boolean
              description: A boolean where true means - allow containers with no tags specified to be deployed to this server.
            services:
              type: boolean
              description: A boolean where true means - allow service containers to be deployed to this container.
            overcommit:
              type: boolean
              description: A boolean where true means - allow twice the normal amount of CPU shares to be allocated to containers deployed to this server.
            overcommit_multiple:
              type:
                - integer
                - 'null'
              description: An integer that describes the capability of a server to overcommit shares.  This will allow more containers to run on a given server based on the servers available CPU. 1 thread (or vCPU) = 10 shares.
    ServerState:
      title: ServerState
      allOf:
        - required:
            - current
          properties:
            current:
              description: The current state of the server.
              type: string
              enum:
                - new
                - provisioning
                - configuring
                - quarantined
                - live
                - deleting
                - deleted
        - $ref: '#/components/schemas/State'
    ServerStatsNetwork:
      title: ServerStatsNetwork
      type: object
      description: Statistics about the networks on a given server.
      required:
        - external_ipv4
        - external_ipv6
      properties:
        interfaces:
          type: object
          description: Network interfaces for a given server.
          additionalProperties:
            type: object
            required:
              - interface
              - flags
              - mtu
              - mac_addr
              - speed
              - rx_bytes
              - tx_bytes
            description: Network interface.
            properties:
              interface:
                type: string
                description: The interface name.
              flags:
                type: string
                description: Flags for the given interface.
              mtu:
                type: integer
                description: The maximum transmission unit for the interface.
              mac_addr:
                type: string
                description: The mac address for the interface.
              addrs:
                description: An array of IP addresses associated with the interface.
                type:
                  - array
                  - 'null'
                items:
                  type: string
              speed:
                description: The link speed for the interface in megabits.
                type: integer
              rx_bytes:
                description: The bytes received over the interface.
                type: integer
              tx_bytes:
                description: The bytes transmitted over the interface.
                type: integer
        external_ipv4:
          type: string
          description: The public IPv4 address used to connect to this server.
        external_ipv6:
          type: string
          description: The public IPv6 address used to connect to this server.
    ServerStatsUptime:
      title: ServerStatsUptime
      type: object
      description: Statistics describing the uptime of a given server.
      properties:
        seconds:
          type: number
          description: The amount in seconds the server has been up (resets on restart).
        cpu_idle:
          type: number
          description: CPU idle time.
    ServerStatsCpuUsage:
      title: ServerStatsCpuUsage
      type: object
      properties:
        user:
          type: integer
        nice:
          type: integer
        system:
          type: integer
        idle:
          type: integer
        iowait:
          type: integer
        irq:
          type: integer
        soft_irq:
          type: integer
        steal:
          type: integer
        guest:
          type: integer
        guest_nice:
          type: integer
    ServerStatsCpu:
      title: ServerStatsCpu
      type: object
      description: Statistics about the CPU resources on a server.
      properties:
        physical_cpus:
          type: integer
          description: The number of physical CPU's for a given server.
        cores:
          type: integer
          description: The number vCPU's for a given server.
        threads:
          type: integer
          description: The number of CPU threads for a given server.
        processors:
          description: An array of processor information objects.
          type: array
          items:
            type: object
            description: Processor information.
            properties:
              model:
                type: string
                description: The model of the processor.
              speed:
                type: number
                format: float
                description: The speed of the processor.
        usage:
          $ref: '#/components/schemas/ServerStatsCpuUsage'
        virtualization:
          description: A true value indicates the server supports virtualization.
          type: boolean
    ServerStatsLoad:
      title: ServerStatsLoad
      type: object
      description: Statistics about the current load on the server.
      required:
        - avg1m
        - avg5m
        - avg15m
      properties:
        avg1m:
          type: number
          format: float
          description: The 1 minute load average.
        avg5m:
          type: number
          format: float
          description: The 5 minute load average.
        avg15m:
          type: number
          format: float
          description: the 15 minute load average.
    ServerStatsRam:
      title: ServerStatsRam
      type: object
      description: Statistics about the RAM on a given server.
      required:
        - available
        - free
        - total
      properties:
        available:
          type: integer
          description: The available RAM on the server.
        free:
          type: integer
          description: The free RAM on the server.
        total:
          type: integer
          description: The total RAM on the server.
    ServerStatsStorage:
      title: ServerStatsStorage
      type: object
      description: Statistics about storage for a given server.
      required:
        - volume_groups
        - mounts
      properties:
        volume_groups:
          description: An array of volume group objects.
          type: object
          additionalProperties:
            type: object
            description: Volume group
            required:
              - name
              - size
              - volumes
            properties:
              name:
                type: string
                description: A name for the volume group.
              size:
                type: integer
                description: A number representing the aggregate group volume size in megabytes.
              volumes:
                description: The actual volumes.
                type: object
                additionalProperties:
                  type: object
                  required:
                    - name
                    - size
                    - data_percent
                    - meta_percent
                    - pool
                  properties:
                    name:
                      type: string
                      description: The name of the volume.
                    size:
                      type: integer
                      description: The size in megabytes of the volume.
                    data_percent:
                      type: integer
                      description: The percent of the volumes size being used by data.
                    meta_percent:
                      type: integer
                      description: The percent of the volumes size being used by meta data.
                    pool:
                      type: string
                      description: The name of the volume pool this volume is associated with.
        mounts:
          type: object
          description: Records that show information about mounted filesystems where the key is the path to the mount.
          additionalProperties:
            title: MountedFS
            type: object
            description: Mounted filesystem information.
            required:
              - type
              - total
              - free
              - used
            properties:
              device:
                type: string
                description: The device assocaited with the mount.
              type:
                type: string
                description: The type of filesystem in use by the mount.
              mountpoint:
                type: string
                description: The path the mount is associated with.
              total:
                type: integer
                description: The total amount of storage in KB available at this mount.
              free:
                type: integer
                description: The amount of uninitialized storage in KB.
              used:
                type: integer
                description: The amount of storage being used in KB.
    ServerStatsOS:
