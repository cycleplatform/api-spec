get:
  operationId: "getMonitor"
  summary: Get Monitor
  description: Requires the `monitoring-monitors-view` capability.
  tags:
    - Monitoring
  parameters:
    - name: id
      in: path
      required: true
      description: The ID of the monitor to fetch.
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
    - name: include
      in: query
      required: false
      description:
        A comma separated list of include values. Included resources will show up under
        the root document's `include` field, with the key being the id of the included resource.
      schema:
        type: array
        items:
          type: string
          enum:
            - creators
  responses:
    200:
      description: Returns a Monitor.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../../../components/schemas/monitoring/monitors/Monitor.yml
              includes:
                type: object
                properties:
                  creators:
                    $ref: ../../../../components/schemas/includes/IncludedCreators.yml
    default:
      $ref: ../../../../components/responses/errors/DefaultError.yml
patch:
  operationId: "updateMonitor"
  summary: Update Monitor
  description: |
    Requires the `monitoring-monitors-manage` capability.

    Monitors in `deleting` or `deleted` state cannot be updated.
  tags:
    - Monitoring
  parameters:
    - name: id
      in: path
      required: true
      description: The ID of the monitor to update.
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: A user-defined name for the monitor. Cannot be empty when provided.
            identifier:
              oneOf:
                - $ref: ../../../../components/schemas/Identifier.yml
                - type: "null"
            description:
              type: string
              description: A longer description of what this monitor observes and why.
            scope:
              type: object
              description: What this monitor observes.
              required:
                - global
                - clusters
              properties:
                global:
                  type: boolean
                  description: When true, the monitor observes all clusters within the hub.
                clusters:
                  type: array
                  description: Cluster identifiers this monitor is scoped to. Ignored when global is true.
                  items:
                    $ref: ../../../../components/schemas/Identifier.yml
  responses:
    200:
      description: Returns the updated Monitor.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../../../components/schemas/monitoring/monitors/Monitor.yml
    default:
      $ref: ../../../../components/responses/errors/DefaultError.yml
delete:
  operationId: "deleteMonitor"
  summary: Delete Monitor
  description: |
    Requires the `monitoring-monitors-manage` capability.

    Deletion runs asynchronously via a job. The response returns a Task with the queued job details.
  tags:
    - Monitoring
  parameters:
    - name: id
      in: path
      required: true
      description: The ID of the monitor to delete.
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
  responses:
    202:
      description: Returns a Task acknowledging the queued deletion job.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../../../components/schemas/jobs/JobDescriptor.yml
    default:
      $ref: ../../../../components/responses/errors/DefaultError.yml
