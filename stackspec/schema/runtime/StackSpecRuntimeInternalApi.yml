title: StackSpecRuntimeInternalApi
description: Configuration options for the internal API access within instances of this container.
type: object
properties:
  disable:
    oneOf:
      - type: boolean
        description: If true, the internal API will be disabled for instances of this container.
      - $ref: ../StackVariable.yml
  scope:
    oneOf:
      - type: array
        description: Scopes determine which set of endpoints instances of this container can reach over the internal API.
        items:
          type: string
          enum:
            - self
            - environment
            - networks
            - server
            - notifications
      - type: "null"
      - $ref: ../StackVariable.yml
